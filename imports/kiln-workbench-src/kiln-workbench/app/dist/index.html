// C = A\xB7B, every element a dot product of length N: 2N\xB3 flops over 12N\xB2 bytes of unique data, so a
// matmul has plenty of reuse (N/6 flop per unique byte). The schedule decides how much of that reuse
// reaches the hardware: every step below cuts the traffic of one level of the memory hierarchy.
// The \`step\` slider pins the tile pass's choice through a custom decide policy. See the Notes.
const N_ = param.int("n", { min: 256, max: 2048, default: 1024, scale: "log", help: "C = A\xB7B with A, B, C all n\xD7n" });
const STEP = param.enum("step", ["1 naive", "2 smem tiles", "3 1-D register tiles", "4 2-D register tiles", "5 8x8 tiles", "6 cost model"], { default: "1 naive", help: "which schedule the tile pass must take" });
const LADDER = {
  "1 naive":                 { MAP: "thread", TPB: 256, COARSEN: 1 },
  "2 smem tiles":            { MAP: "tiled", BM: 32, BN: 32, BK: 32, TM: 1, TN: 1 },
  "3 1-D register tiles":    { MAP: "tiled", BM: 64, BN: 64, BK: 8, TM: 8, TN: 1 },
  "4 2-D register tiles":    { MAP: "tiled", BM: 128, BN: 128, BK: 8, TM: 8, TN: 2 },
  "5 8x8 tiles":             { MAP: "tiled", BM: 128, BN: 128, BK: 8, TM: 8, TN: 8 },
};

// a decide policy: score 0 for the option the step names, Infinity for the others; "6 cost model" passes
const ladder = k.decide.cost(({ knobs, run }) => {
  const want = LADDER[run.params.get(STEP)];
  if (!want) return null;
  return Object.entries(want).every(([key, v]) => knobs[key] === v) ? 0 : Infinity;
}, { name: "ladder" }).for("schedule");
const base = std.emmy.pipeline();

project("matmul-ladder")
  .pipeline(base.with({ decide: k.decide.chain(k.decide.pinned(), ladder, base._decide) }))
  .params(N_, STEP)
  .program(({ a, b }) => ({ c: N.matmul(a, b) }), ({ param }) => ({ a: k.tensor([param(N_), param(N_)]), b: k.tensor([param(N_), param(N_)]) }))
  .check("the schedule this step asks for", ({ run }) => {
    const d = run.decisions[0], want = LADDER[run.params.get(STEP)];
    if (!want) return { ok: true, message: \`the cost model picked \${std.tile.canonRow(d.knobs)}\` };
    return Object.entries(want).every(([key, v]) => d.knobs[key] === v) ? { ok: true, message: std.tile.canonRow(d.knobs) } : \`got \${std.tile.canonRow(d.knobs)} (illegal on this device?)\`;
  });
`,notes:`# The matmul ladder

Matrix multiplication is the workload GPUs are built for and the classic lesson in GPU optimization. This project compiles one $1024 \\times 1024$ matmul five ways, plus whatever the cost model picks. Each step removes the bottleneck of the step before and reveals the next. The \`step\` parameter pins the schedule.

> **Try it** \u2014 measure each step in turn and keep [Perf](lab:view?name=perf) open:
> [1 naive](lab:param?name=step&value=1%20naive&measure) \xB7
> [2 shared-memory tiles](lab:param?name=step&value=2%20smem%20tiles&measure) \xB7
> [3 1-D register tiles](lab:param?name=step&value=3%201-D%20register%20tiles&measure) \xB7
> [4 2-D register tiles](lab:param?name=step&value=4%202-D%20register%20tiles&measure) \xB7
> [5 8\xD78 tiles](lab:param?name=step&value=5%208x8%20tiles&measure) \xB7
> [6 the cost model's pick](lab:param?name=step&value=6%20cost%20model&measure)

## The maths: plenty of reuse, if you can keep it

$C = AB$ with $A, B, C \\in \\mathbb{R}^{N \\times N}$ costs

$$W = 2N^3 \\text{ flop}, \\qquad Q_\\text{min} = 3 \\cdot 4N^2 \\text{ bytes}, \\qquad I_\\text{max} = \\frac{2N^3}{12N^2} = \\frac{N}{6}$$

At $N = 1024$ the best possible intensity is 171 flop/byte, about three times the RTX 5090's ridge point (58.5). In principle matmul is compute-bound. In practice every element of $A$ is used $N$ times, and **the schedule decides how many of those uses reach the chip from far away** (DRAM or L2) versus nearby (shared memory or a register). Each rung of the ladder moves reuse one level closer to the arithmetic units:

| level | where a value lives | approximate bandwidth on an RTX 5090 |
|---|---|---|
| DRAM | off-chip GDDR7 | 1.8 TB/s |
| L2 | on-chip, shared by all SMs | ~5 TB/s (the simulator assumes 3\xD7 DRAM) |
| shared memory | per SM, 32 banks \xD7 4 B per clock | 170 SMs \xD7 128 B \xD7 2.41 GHz \u2248 52 TB/s |
| registers | per thread | operands of every instruction, every clock |

## What you should see

Simulated RTX 5090, $N = 1024$ ($W$ = 2.15 GFLOP):

| step | schedule | time | TFLOP/s | bound | L2 traffic | smem wavefronts | occupancy |
|---|---|---:|---:|---|---:|---:|---:|
| 1 naive | thread per output | 1087 \xB5s | 2.0 | l2 | 5.0 GiB | \u2014 | 1.00 |
| 2 smem tiles | 32\xD732\xD732 tiles | 199 \xB5s | 10.8 | smem | 260 MiB | 69.2 M | 0.67 |
| 3 1-D register tiles | 64\xD764, 8\xD71 per thread | 128 \xB5s | 16.7 | smem | 132 MiB | 38.8 M | 1.00 |
| 4 2-D register tiles | 128\xD7128, 8\xD72 per thread | 169 \xB5s | 12.7 | smem | 72 MiB | 25.7 M | 0.67 |
| 5 8\xD78 tiles | 128\xD7128, 8\xD78 per thread | 336 \xB5s | 6.4 | smem | 96 MiB | 25.7 M | 0.33 (regs) |
| 6 cost model | 16\xD732, 2\xD74 per thread, 64 threads | **99 \xB5s** | 21.7 | smem | 400 MiB | 36.7 M | 1.00 (0.54) |

At $N = 2048$ ([try it](lab:param?name=n&value=2048)), steps 1\u20135 take 8141, 1405, 925, **669** and 891 \xB5s. Step 4 is slower than step 3 at $N = 1024$ but faster at $N = 2048$; the next sections explain why. At both sizes the cost model's own pick beats every rung of the ladder: the last section explains that too.

### Step 1 \u2192 2: from L2 to shared memory

Naive: thread $(i, j)$ loops over $k$, loading $A_{ik}$ and $B_{kj}$ from global memory.

- The 32 threads of a warp share $i$, so the $A_{ik}$ load is one broadcast sector.
- They have consecutive $j$, so $B_{kj..k(j+31)}$ is 128 contiguous bytes: 4 sectors.

That is 5 sectors for 2 loads, the **2.5 sectors per request** in [Perf](lab:view?name=perf), and

$$Q_\\text{L2} = \\underbrace{\\tfrac{N^2}{32}}_{\\text{warps}} \\cdot N \\cdot 5 \\cdot 32\\,\\text{B} = 5.4\\text{ GB} = 5.0\\text{ GiB}$$

At the simulated L2 bandwidth, that is about 1 ms. Nothing is reused on-chip.

Tiling: a block computes a $B_M \\times B_N$ tile of $C$. For each slab of $B_K$ along $k$, the block cooperatively copies an $A$ tile and a $B$ tile into shared memory, synchronizes, then computes from there. Each global value now serves a whole tile, so $A$ is fetched $N/B_N$ times and $B$ is fetched $N/B_M$ times:

$$Q_\\text{L2} = 4N^2\\left(\\frac{N}{B_N} + \\frac{N}{B_M}\\right) = 4 \\cdot 1024^2 \\cdot (32 + 32) = 268\\text{ MB}$$

That is 20\xD7 less. The bottleneck moves to **shared-memory bandwidth**. Every FMA still reads 2 operands from shared memory, and a warp-wide read is one "wavefront" per clock per SM: $N^3 \\cdot 2 / 32 \\approx 67$ M wavefronts, plus the tile stores, makes 69 M.

### Step 2 \u2192 3: from shared memory to registers (1-D)

Give each thread $T_M = 8$ outputs in a column. For each $k$ it loads 8 values of $A$ and **one** value of $B$, reusing that $B$ value from a register 8 times. Per warp and per $k$:

- 8 broadcast $A$ reads plus 1 $B$ read = 9 wavefronts for $32 \\times 8 = 256$ FMAs, 0.035 wavefronts per FMA;
- step 2 needed 2 wavefronts for 32 FMAs, 0.0625 per FMA.

The ratio, 0.56, is exactly the drop in the smem column: 69.2 M \u2192 38.8 M.

### Step 3 \u2192 4: 2-D register tiles \u2014 and wave quantization

With an $8 \\times 2$ register tile, each $k$ step is 8 $A$ + 2 $B$ loads for 16 FMAs, and shared-memory traffic drops again (25.7 M). **But the time goes up.** Tiles of $128 \\times 128$ cut a $1024 \\times 1024$ matrix into only

$$\\frac{1024}{128} \\cdot \\frac{1024}{128} = 64 \\text{ blocks}$$

on a GPU with 170 SMs: **106 SMs sit idle**. That is wave quantization \u2014 the grid doesn't fill the machine. At $N = 2048$ there are 256 blocks and step 4 beats step 3.

$$\\text{waves} = \\left\\lceil \\frac{\\text{blocks}}{\\text{SMs} \\times \\text{blocks per SM}} \\right\\rceil, \\qquad \\text{SM use in the last wave} = \\frac{\\text{blocks left}}{\\text{SMs}}$$

### Step 4 \u2192 5: more reuse on paper, slower in practice

An $8 \\times 8$ register tile has the best reuse ratio on paper, (8 + 8) loads per 64 FMAs. It loses for two reasons.

- **Bank conflicts.** Thread $t$ reads $B$ at shared address $k \\cdot B_N + 8t$. Shared memory has 32 banks, 4 bytes wide, so addresses $0, 8, 16, \\dots$ fall in only 4 banks: a **4-way bank conflict**, 4 wavefronts per read. The bank-conflict column in Perf shows 1.88 extra wavefronts per request.
- **Registers.** 64 accumulators plus operands is about 104 registers per thread. $65{,}536 / (104 \\cdot 256)$ = 2 blocks per SM: 33% occupancy, limited by registers.

Production kernels fix both with vectorized \`float4\` loads, swizzled or transposed shared-memory layouts, and *warp tiling*. Those transformations are the next rungs this compiler does not have yet.

### Step 6: the cost model's pick wins by balance, not reuse

The cost model searches all 645 legal tile shapes and picks **16\xD732 tiles with a 2\xD74 register tile per thread**: 64 threads per block, 2048 blocks. Its shared-memory traffic is about the same as step 3's (36.7 M vs 38.8 M wavefronts), yet it runs in 99 \xB5s instead of 128. The difference is **load balance**.

- Step 3 launches 256 blocks on 170 SMs. 86 SMs get two blocks and 84 get one, so the kernel lasts as long as two blocks while the average SM does $256/170 = 1.51$ blocks' work. A quarter of the machine idles for the second half.
- Step 6 launches 2048 small blocks. The busiest SM runs $\\lceil 2048/170 \\rceil = 13$, against an average of 12.05: 7% idle.

$$t \\approx \\frac{\\text{wavefronts}}{\\text{SMs} \\cdot f} \\cdot \\frac{\\text{blocks on the busiest SM}}{\\text{average blocks per SM}} + t_\\text{launch}: \\quad \\frac{38.8\\text{M}}{410\\text{G/s}} \\cdot \\frac{2}{1.51} + 2.5 = 128\\ \\mu s, \\qquad \\frac{36.7\\text{M}}{410\\text{G/s}} \\cdot \\frac{13}{12.05} + 2.5 = 99\\ \\mu s$$

At $N = 2048$ the pick changes to 32\xD764 tiles with 8\xD74 per thread (566 \xB5s, 30.4 TFLOP/s, vs 669 for step 4), and on the A100 at $N = 1024$ it is again 16\xD732 with 2\xD74 (244 \xB5s, vs 287 for step 4). Hand-written ladders choose tiles for reuse; a search over tile shapes also sees the grid. Many small blocks are the cheap fix for tail effects; production libraries use *split-K* or *stream-K* to the same end.

## Where this leaves us

The best schedule here reaches 21.7 TFLOP/s, 21% of the RTX 5090's 104.8 TFLOP/s FP32 peak, and it is limited by shared memory. Simon Boehm's post climbs the same ladder further: vectorized shared-memory loads, warp tiling, autotuned tile shapes. He ends close to cuBLAS. Beyond that, tensor cores change the arithmetic itself.

Same ladder, [A100](lab:device?id=sim:a100&measure), $N = 1024$: 883, 482, 325, **287**, 653 \xB5s. With 108 SMs, the 64-block grid of step 4 hurts less than on the 5090.

## The system

- The \`step\` parameter is read by a custom **decide policy**, \`ladder\`. It scores the option that matches the step at 0 and every other option at Infinity, and sits in front of the standard chain (pins \u2192 evidence \u2192 cost model). Step 6 returns \`null\` for every option, so the standard chain decides. See the script, and \`by: ladder\` in [Knobs](lab:view?name=knobs).
- The kernel bodies are in [Kernels](lab:view?name=kernels): the \`Tile\` tab shows the schedule, \`Kernel IR\` the shared-memory staging and register tile, \`CUDA\` the code.
- The simulator counts every shared-memory request per warp exactly as the hardware does: the most distinct addresses in any one bank. The cost model computes the same count analytically from the same addresses.

## Exercises

1. Compute $Q_\\text{L2}$ for step 3 from the formula and compare with the 132 MiB measured.
2. Why is the naive kernel's $A$ load a broadcast? Rewrite the program as $C = (B^\\top A^\\top)^\\top$ and see whether the naive version gets worse.
3. Add a padding knob to the tiled materializer (\`kernel.js\`, \`matTiled\`): store $B$ with a stride of $B_N + 1$. Does step 5's conflict disappear?
4. Tune with [SP-MCTS](lab:tune?strategy=spmcts&budget=32) and compare its best schedule with the cost model's.

- Hwu, Kirk, El Hajj, *Programming Massively Parallel Processors*, the chapters on tiling and memory
- [CUTLASS](https://docs.nvidia.com/cutlass/) and [CuTe](https://docs.nvidia.com/cutlass/latest/media/docs/cpp/cute/index.html): how production kernels lay out tiles

// next to the spread, E[x\xB2] and \u03BC\xB2 are two huge, nearly equal numbers, and their difference in fp32 is
// mostly rounding error (catastrophic cancellation). LayerNorm needs this statistic for every row.
// The simulator computes in fp32 like the GPU; the reference accumulates in fp64. See the Notes.
const offset = param.enum("offset", [0, 1, 10, 100, 1000, 10000], { default: 0, help: "added to every input: the mean moves, the spread stays" });
const rows = param.int("rows", { min: 16, max: 8192, default: 1024, scale: "log" });
const dim = param.int("dim", { min: 64, max: 8192, default: 2048, scale: "log" });

project("variance")
  .params(offset, rows, dim)
  .program(({ x }, { param }) => {
    const D = param(dim);
    const xs = N.add(x, param(offset));                        // inputs are uniform on [\u22121, 1): \u03C3\xB2 = 1/3
    const mean = (t) => N.mul(N.sum(t, -1), 1 / D);            // each method computes its own means, so each
    // output is one self-contained kernel (and each kernel's check sees the real arithmetic)
    const two_pass = mean(N.square(N.sub(xs, mean(xs))));                  // E[(x \u2212 \u03BC)\xB2]
    const one_pass = N.sub(mean(N.square(xs)), N.square(mean(xs)));        // E[x\xB2] \u2212 \u03BC\xB2
    const xk = N.sub(xs, N.slice(xs, -1, 0, 1));                           // shift by the row's first value K
    const shifted = N.sub(mean(N.square(xk)), N.square(mean(xk)));         // E[(x\u2212K)\xB2] \u2212 E[x\u2212K]\xB2
    return { two_pass, one_pass, shifted };
  }, ({ param }) => ({ x: k.tensor([param(rows), param(dim)]) }))
  .check("the reference variance is 1/3 (inputs are uniform on [\u22121, 1))", ({ outputs }) => {
    const v = outputs.two_pass.data, m = v.reduce((a, b) => a + b, 0) / v.length;
    return Math.abs(m - 1 / 3) < 0.01 || \`mean of the row variances \${m}\`;

`,notes:`# Variance three ways: speed vs. numerics

LayerNorm, BatchNorm and RMSNorm all compute a variance per row, on every layer, for every token. A tempting "optimization" computes it in one pass over the data instead of two. On a GPU in fp32, that formula can return garbage. This project computes the same statistic three ways side by side, so you can watch it happen.

> **Try it** \u2014 [measure at offset 0](lab:measure): all three kernels pass. Then [offset 100](lab:param?name=offset&value=100&measure), [offset 1000](lab:param?name=offset&value=1000&measure) and [offset 10000](lab:param?name=offset&value=10000&measure), and read the checks in [Perf](lab:view?name=perf). [Reset to 0](lab:param?name=offset&value=0).

## The program

Inputs $x_{ij}$ are uniform on $[-1, 1)$, so the true variance of every row is $\\sigma^2 = 1/3$. The program adds an offset $c$ to every input \u2014 the mean moves, the spread stays \u2014 and returns three per-row variances:

| output | formula | sweeps over the row |
|---|---|---|
| \`two_pass\` | $\\mu = \\frac1D\\sum_j x_j$, then $\\frac1D\\sum_j (x_j - \\mu)^2$ | 2 |
| \`one_pass\` | $\\frac1D\\sum_j x_j^2 \\;-\\; \\mu^2$ | 1 |
| \`shifted\` | $K = x_0$, then $\\frac1D\\sum_j (x_j - K)^2 - \\big(\\frac1D\\sum_j (x_j-K)\\big)^2$ | 1 |

All three are algebraically identical:

$$\\operatorname{Var}(x) = \\mathbb{E}\\big[(x-\\mu)^2\\big] = \\mathbb{E}[x^2] - \\mu^2 = \\mathbb{E}\\big[(x-K)^2\\big] - \\big(\\mathbb{E}[x-K]\\big)^2 \\quad\\text{for any } K$$

Each method computes its own means, so each output is one self-contained kernel: \`k_two_pass\`, \`k_one_pass\` and \`k_shifted\` in [Kernels](lab:view?name=kernels).

## The maths: catastrophic cancellation

fp32 stores 24 significant bits. Every operation's result is exact up to a relative error of the **unit roundoff** $u = 2^{-24} \\approx 5.96 \\times 10^{-8}$.

The one-pass formula subtracts two large, nearly equal numbers: $\\mathbb{E}[x^2] \\approx c^2 + \\sigma^2$ and $\\mu^2 \\approx c^2$. Each carries an absolute rounding error of about $u \\cdot c^2$, and the subtraction keeps the errors while cancelling the true values. The relative error of the result is roughly

$$\\frac{|\\widehat{\\operatorname{Var}} - \\operatorname{Var}|}{\\operatorname{Var}} \\;\\approx\\; u \\cdot \\frac{c^2 + \\sigma^2}{\\sigma^2} \\cdot g(D)$$

where $g(D)$ is a modest growth factor from accumulating $D$ terms (about $\\log_2 D$ for a tree reduction). The ratio $c^2/\\sigma^2$ is the **condition number** of this way of computing the variance. With $\\sigma^2 = 1/3$:

| offset $c$ | $c^2/\\sigma^2$ | predicted relative error | simulated max error of \`one_pass\` (absolute) |
|---:|---:|---:|---:|
| 1 | 3 | $2 \\times 10^{-7}$ | $9 \\times 10^{-8}$ |
| 10 | 300 | $2 \\times 10^{-5}$ | $8 \\times 10^{-6}$ |
| 100 | $3 \\times 10^4$ | $2 \\times 10^{-3}$ | $1.4 \\times 10^{-3}$ \u2014 **fails** |
| 1000 | $3 \\times 10^6$ | 0.2 | 0.039 \u2014 fails |
| 10000 | $3 \\times 10^8$ | 20 | 8.3 \u2014 the "variance" is meaningless |

The two-pass formula subtracts the mean *before* squaring. Its terms $(x_j - \\mu)^2$ are small, nothing large cancels, and its error stays near $u$ for every offset (simulated $\\le 2 \\times 10^{-5}$ even at $c = 10^4$). The shifted formula gets the same protection with one pass: subtracting any value $K$ close to the data makes $x - K$ small, and $K = x_0$ is close.

## What you should see

All three kernels take **7.9 \xB5s**, with or without numerical trouble. The input is 8 MiB per call and every version is memory-bound. The "extra" sweep of the two-pass method re-reads a row that one thread block touched microseconds earlier, so it hits cache.

The one-pass formula buys nothing in speed and costs everything in accuracy. That is the lesson: **check whether an optimization changes the numerics, and measure whether it changes the speed.**

## The system: how the failure is caught

- The simulated GPU computes in **fp32**: every register is a \`Float32Array\` element, and every sum is a tree of fp32 adds, as on a real GPU. The reference (\`compilePoint\`, the Loop IR evaluated in JavaScript) accumulates in **fp64**. Each measurement compares the kernel's sampled outputs against that reference with relative tolerance $2 \\times 10^{-3}$, which is how \`k_one_pass\` fails while the others pass.
- The end-to-end check in [Code](lab:view?name=code) fails too at large offsets. There the frontend reference, which rounds every op's result to fp32, disagrees with the Loop IR, which keeps intermediates in fp64 inside a kernel. Two implementations of an ill-conditioned formula disagree with each other \u2014 a symptom worth recognizing.
- Per-kernel checks use synthetic inputs, uniform on $[-1, 1)$. They catch this bug only because the offset is added *inside* the kernel. If the offset came from upstream data, the test inputs would miss it. **Test with realistic magnitudes.**

## Welford, and why this compiler can't express it (yet)

Welford's algorithm updates a running mean and sum of squared deviations one element at a time:

$$\\mu_k = \\mu_{k-1} + \\frac{x_k - \\mu_{k-1}}{k}, \\qquad M_k = M_{k-1} + (x_k - \\mu_{k-1})(x_k - \\mu_k)$$

Two partial results $(n_a, \\mu_a, M_a)$ and $(n_b, \\mu_b, M_b)$ merge exactly (Chan, Golub and LeVeque), with $\\delta = \\mu_b - \\mu_a$ and $n = n_a + n_b$:

$$\\mu = \\mu_a + \\delta\\,\\frac{n_b}{n}, \\qquad M = M_a + M_b + \\delta^2\\,\\frac{n_a n_b}{n}$$

The merge is associative, so it fits a GPU tree reduction: one pass, numerically stable. This compiler's reductions only combine with \`add\`, \`max\`, \`min\` and \`mul\`. Adding a reducer over a *tuple* $(n, \\mu, M)$ is the same extension online softmax and FlashAttention need.

## Takeaways

1. Algebraic identities are not numerical identities. $\\mathbb{E}[x^2] - \\mu^2$ loses about $\\log_2(c^2/\\sigma^2)$ bits.
2. On a GPU, a second sweep over a row in cache or shared memory is cheap. Don't trade accuracy for it without measuring.
3. Kernel tests need inputs with realistic magnitudes and offsets, not just values on $[-1, 1)$.

## Exercises

1. At which offset does \`one_pass\` lose all significant digits? Predict with $\\log_2(c^2/\\sigma^2) \\ge 24$, then check.
2. Change \`K\` to the row's maximum instead of its first element. Is \`shifted\` still stable? Why does any sample of the row work?
3. Add a pairwise (tree) summation variant of \`one_pass\` in fp32 by hand. Does it help? (Hint: the cancellation is in the final subtraction, not the sum.)

## Further reading

- Higham, *Accuracy and Stability of Numerical Algorithms*, the chapters on summation and on computing the variance
- Welford (1962), *Note on a method for calculating corrected sums of squares and products*; Chan, Golub, LeVeque (1983), *Algorithms for computing the sample variance*
- Goldberg, *What Every Computer Scientist Should Know About Floating-Point Arithmetic*

`,notes:`# Occupancy and latency hiding

A DRAM read takes several hundred nanoseconds. A GPU doesn't wait for it: each SM keeps many warps resident and switches to another one whenever a warp stalls. **Occupancy** \u2014 how many warps an SM can hold at once \u2014 sets how much latency it can hide. This project is a softmax over long rows (2048 \xD7 8192). Two schedule knobs change its occupancy over a 16\xD7 range.

> **Try it** \u2014 pin a schedule, measure, and read *occupancy* and *limiter* in [Perf](lab:view?name=perf):
> [32 threads](lab:pin?MAP=row&TPB=32&STAGE=none&measure) \xB7
> [64 threads](lab:pin?MAP=row&TPB=64&STAGE=none&measure) \xB7
> [1024 threads](lab:pin?MAP=row&TPB=1024&STAGE=none&measure) \xB7
> [32 threads + row staged in shared memory](lab:pin?MAP=row&TPB=32&STAGE=reused&measure) \xB7
> [256 + staged](lab:pin?MAP=row&TPB=256&STAGE=reused&measure) \xB7
> [1024 + staged](lab:pin?MAP=row&TPB=1024&STAGE=reused&measure) \xB7
> [unpin](lab:unpin)

## The maths: four budgets per SM

A block can only run on an SM that has room for **all** of its threads, registers and shared memory. The number of blocks resident per SM is the tightest of four limits:

$$b \\;=\\; \\min\\left( b_\\text{max},\\; \\left\\lfloor \\frac{T_\\text{SM}}{T} \\right\\rfloor,\\; \\left\\lfloor \\frac{R_\\text{SM}}{r \\cdot T} \\right\\rfloor,\\; \\left\\lfloor \\frac{S_\\text{SM}}{s} \\right\\rfloor \\right), \\qquad \\text{occupancy} = \\frac{b \\cdot \\lceil T/32 \\rceil}{T_\\text{SM}/32}$$

Here $T$ is threads per block, $r$ registers per thread and $s$ shared memory per block. For the simulated RTX 5090: $b_\\text{max} = 24$ blocks, $T_\\text{SM} = 1536$ threads (48 warps), $R_\\text{SM} = 65{,}536$ registers, $S_\\text{SM} = 128$ KiB.

### Worked examples

| schedule | threads | blocks | registers | shared mem | \u2192 blocks/SM | limiter | occupancy |
|---|---:|---:|---:|---:|---:|---|---:|
| TPB=32 | 1536/32 = 48 | 24 | 73 | 1024 | **24** | blocks | 24 warps / 48 = 0.50 |
| TPB=64 | 24 | 24 | 35 | 512 | 24 | blocks/threads | 48/48 = 1.00 |
| TPB=1024 | **1** | 24 | 1 | 32 | 1 | threads | 32/48 = 0.67 |
| TPB=32, row staged (32.9 KiB) | 48 | 24 | 73 | **3** | 3 | smem | 3/48 = 0.06 |
| TPB=1024, row staged (36.9 KiB) | **1** | 24 | 1 | 3 | 1 | threads | 0.67 |

That is the *theoretical* occupancy. The simulator also reports *achieved* occupancy, which depends on the grid. There are 2048 rows, so 2048 blocks over 170 SMs: about 12 blocks per SM in all. With TPB=32 they all fit in one wave, so each SM holds 13 one-warp blocks at most: 13/48 = 0.27, not 0.50.

## The maths: Little's law

How many warps does it take to keep DRAM busy? Bytes in flight must equal bandwidth \xD7 latency:

$$\\text{bytes in flight} = \\beta \\times L \\approx 1792\\ \\text{GB/s} \\times 600\\ \\text{ns} \\approx 1.08\\ \\text{MB}$$

Spread over 170 SMs, that is about 6.3 KB per SM. One warp-wide 4-byte load moves 128 bytes, so an SM needs about **49 loads in flight**: one from each of 48 warps at full occupancy, or 4 independent loads each from 12 warps. More warps and more independent work per thread (instruction-level parallelism) are interchangeable. Thread coarsening and vector loads buy latency hiding without occupancy.

The latency $L$ here is an assumed round figure: real DRAM latency under load is roughly 400\u2013800 ns. The simulator encodes the idea with a crude curve: the fraction of peak bandwidth reachable is $\\min(1, 0.2 + 1.6 \\cdot \\text{occupancy})$. Full bandwidth needs about 50% occupancy; at 6% you get 30%.

## What you should see

Simulated RTX 5090. Each row of 8192 floats is read three times: max, sum, normalize.

| TPB | staged | occupancy (achieved) | limiter | DRAM traffic | time |
|---:|---|---:|---|---:|---:|
| 32 | no | 0.50 (0.27) | blocks | 154 MiB | 155.6 \xB5s |
| 64 | no | 1.00 (0.54) | blocks | 154 MiB | 99.5 \xB5s |
| 1024 | no | 0.67 (0.67) | threads | 154 MiB | 99.5 \xB5s |
| 32 | yes | 0.06 (0.05) | **smem** | 128 MiB | 277.8 \xB5s |
| 256 | yes | 0.50 (0.43) | smem | 128 MiB | 90.4 \xB5s |
| 1024 | yes | 0.67 (0.67) | threads | 128 MiB | **83.3 \xB5s** |

Three lessons in one table:

- **Staging is a trade.** Keeping the row in shared memory removes two of its three DRAM reads (154 \u2192 128 MiB, the minimum: 64 MiB in, 64 MiB out). But a 32 KiB row per block fits only 3 blocks in an SM's 128 KiB.
- **Small staged blocks starve the SM.** With 32 threads per staged block, 3 blocks are only 3 warps: occupancy 6%, bandwidth collapses, and staging makes things **3\xD7 slower**.
- **Big staged blocks get both.** With 1024 threads, one block per SM is already 32 warps (67%) \u2014 enough to hide latency \u2014 and it reads the row from DRAM once. The best schedule.

## The system

- The cost model computes occupancy per option from the launch configuration, the shared memory the staging needs, and a register estimate; [Knobs](lab:view?name=knobs) ranks every option.
- The timing model splits the grid into **waves** of \`SMs \xD7 blocks per SM\`. A partial last wave runs with fewer resident warps per SM, and so at lower achieved occupancy. That is how the simulator charges for grids that don't fill the GPU.
- Registers per thread come from a simple estimate, not a register allocator. Run the generated CUDA through \`ptxas -v\` (the Devices view explains the runner) to get the real count.

> **Caveat** \u2014 Real GPUs also have L1 caches that can absorb the re-reads of an unstaged row. They let you trade L1 against shared memory (the carveout), and their schedulers hide latency differently by architecture. Occupancy is necessary for bandwidth, not sufficient. The [occupancy calculator in Nsight Compute](https://docs.nvidia.com/nsight-compute/) computes the same four limits on real hardware.

## Takeaways

1. Occupancy = resident warps / maximum warps. It is limited by threads, blocks, registers or shared memory \u2014 whichever runs out first.
2. Memory-bound kernels need enough bytes in flight: high occupancy, or independent loads per thread.
3. Shared-memory staging saves DRAM traffic but spends occupancy. Size blocks so that both work.

## Exercises

1. Compute the occupancy of TPB=128 with the row staged. Predict its time from the table, then [measure it](lab:pin?MAP=row&TPB=128&STAGE=reused&measure).
2. Halve the row: [dim = 4096](lab:param?name=dim&value=4096). Staged blocks now take 16 KiB. How many fit per SM, and does TPB=32 staged recover?
3. Switch to the [H100](lab:device?id=sim:h100&measure) (228 KiB shared memory per SM, 2048 threads). Which limiter changes?

## Further reading

- *CUDA C++ Best Practices Guide*, [the occupancy section](https://docs.nvidia.com/cuda/cuda-c-best-practices-guide/)
- Vasily Volkov, *Better Performance at Lower Occupancy* (GTC 2010), on ILP versus occupancy
- Hwu, Kirk, El Hajj, *Programming Massively Parallel Processors*, the chapter on performance considerations

`,notes:`# One program, five GPUs

"Which GPU is faster?" has no single answer: it depends on which resource your kernels exhaust. This project compiles the feed-forward block of a transformer layer at GPT-2-small width for five simulated GPUs. On each one it measures which schedule wins and what binds.

> **Try it** \u2014 [measure on every simulated GPU](lab:measure?all=sim) (it takes a few seconds), then compare in [Perf](lab:view?name=perf) under *Across devices*. To see one device's schedules, switch to it: [RTX 5090](lab:device?id=sim:rtx5090&measure) \xB7 [RTX 4090](lab:device?id=sim:rtx4090&measure) \xB7 [H100](lab:device?id=sim:h100&measure) \xB7 [A100](lab:device?id=sim:a100&measure) \xB7 [Orin](lab:device?id=sim:orin&measure). The [Knobs](lab:view?name=knobs) view shows the picks.

## The program

$$y = x + W_\\text{down}\\, \\operatorname{GELU}\\!\\big(W_\\text{up}\\, \\operatorname{RMSNorm}(x)\\big), \\qquad x \\in \\mathbb{R}^{256 \\times 768},\\; W_\\text{up} \\in \\mathbb{R}^{3072 \\times 768}$$

It compiles to three kernels:

- RMSNorm: a row kernel.
- Up-projection with GELU fused into its epilogue: a tiled matmul.
- Down-projection with the residual add fused in: a tiled matmul.

Each matmul is $2 \\cdot 256 \\cdot 768 \\cdot 3072 = 1.21$ GFLOP. Its 9.4 MB weight matrix dominates the bytes, so its intensity is about 90 flop/byte.

## The devices

| simulated GPU | SMs | clock | FP32 peak $\\pi$ | DRAM $\\beta$ | ridge $\\pi/\\beta$ | shared-memory rate (SMs \xD7 clock) |
|---|---:|---:|---:|---:|---:|---:|
| RTX 5090 (Blackwell) | 170 | 2.41 GHz | 104.8 TF | 1792 GB/s | 58.5 | 410 G wavefronts/s |
| RTX 4090 (Ada) | 128 | 2.52 | 82.6 | 1008 | 81.9 | 323 |
| H100 SXM (Hopper) | 132 | 1.98 | 67 | 3350 | 20.0 | 261 |
| A100 80GB (Ampere) | 108 | 1.41 | 19.5 | 2039 | 9.6 | 152 |
| Orin Nano class | 8 | 0.625 | 1.28 | 68 | 18.8 | 5 |

By the roofline alone, the matmuls (about 90 flop/byte) are compute-bound everywhere. Then the H100 should be about 1.6\xD7 slower than the 5090 (67 vs 104.8 TFLOP/s) and the A100 about 5\xD7 slower.

## What you should see

Simulated, tokens = 256:

| GPU | total | up-proj + GELU | down-proj + residual | bound |
|---|---:|---|---|---|
| RTX 5090 | 177 \xB5s | 67.8 \xB5s, 32\xD732 tiles, 2\xD72 per thread | 105.7 \xB5s, 32\xD716 tiles | smem |
| RTX 4090 | 176 \xB5s | 70.2 \xB5s, 64\xD732 tiles | 101.2 \xB5s, 32\xD716 tiles | smem |
| H100 | 249 \xB5s | 88.6 \xB5s, 64\xD732 tiles | 157.2 \xB5s | smem |
| A100 | 381 \xB5s | 152.8 \xB5s, 128\xD764, 4\xD72 per thread | 224.7 \xB5s, 128\xD716 | smem |
| Orin | 6261 \xB5s | 3102 \xB5s, 128\xD7128, 8\xD72 per thread | 3131 \xB5s, 128\xD764, 8\xD74 | smem |

**What binds is shared memory, not the FP32 peak and not DRAM.** These kernels read their operands from shared memory at one warp-wide request per SM per clock. Their speed therefore tracks the last column, SMs \xD7 clock:

- The 4090 nearly ties the 5090 despite 22% less FP32 peak.
- The A100 is about 2.2\xD7 slower than the 5090, close to its 2.7\xD7 deficit in shared-memory rate and far from its 5.4\xD7 deficit in FP32 peak.
- The H100 lands between the two.

**The schedules differ per device.** The cost model sees each target's SM count, shared memory and limits:

- **Bigger tiles on fewer SMs.** With 8 SMs the Orin can't use parallelism anyway, so it takes 128\xD7128 tiles for maximum reuse. The 5090 needs at least 170 blocks in flight, so it takes small 32\xD732 tiles that give 768 blocks.
- **Wave quantization.** A schedule with $G$ blocks on $S$ SMs holding $b$ blocks each runs in $\\lceil G / (S b) \\rceil$ waves. A grid that barely spills into an extra wave wastes most of that wave. The best tile size is not a constant; it is a function of the matrix *and* the GPU.

**The RMSNorm kernel** (3\u20134 \xB5s everywhere, 28 \xB5s on the Orin) is launch-bound: 256 rows of 768 floats is 0.8 MB.

## Why the H100 looks bad here

The H100 is built for **tensor cores**: about 989 TFLOP/s dense BF16, against 67 TFLOP/s FP32 on its CUDA cores. It also has HBM3 at 3.35 TB/s. This compiler emits FP32 SIMT code that uses neither, so the H100 competes on shared-memory rate, where a gaming card with more SMs and higher clocks wins. On real workloads the H100 runs this block in BF16 on tensor cores, far faster than the 5090's FP32 path. The lesson is not "the 5090 beats the H100". It is **"performance depends on which units your code actually uses"**.

## The system

- Switching device recompiles: the target's \`maxThreadsPerBlock\`, shared memory per block and SM count change which schedules are legal and how the cost model ranks them. Compare the [Tile IR](lab:ir?name=tile) between devices.
- Every measurement is recorded as evidence keyed by (device, kernel identity, schedule), so tuning results never leak from one GPU to another. See [Tune](lab:view?name=tune).
- *Across devices* in Perf shows each device's latest measurement of this project.

## Takeaways

1. Know which resource binds on *each* target: FP32 peak, tensor cores, DRAM, shared memory or launch overhead. Specs that don't bind don't matter.
2. Schedules are not portable. Tile sizes that fill a 170-SM GPU waste an 8-SM one, and vice versa. Autotune per device, or let the cost model see the device.
3. "Compute-bound" on paper can mean "on-chip-bandwidth-bound" in practice.

## Exercises

1. Raise [tokens to 1024](lab:param?name=tokens&value=1024) and measure on every GPU again. Which GPU gains the most, and why? (Think about blocks per SM and waves.)
2. Compute the waves for the up-projection on the A100: $G = (256/128)(3072/64)$ blocks, 108 SMs. How busy is the last wave?
3. Tune the program on the 5090, then switch to the 4090: does the 5090's evidence apply? Read the *by* column in Knobs.

## Further reading

- NVIDIA, *H100 Tensor Core GPU Architecture* (whitepaper, 2022)
- [Modal GPU Glossary](https://modal.com/gpu-glossary): SMs, warps, tensor cores, occupancy
- Ansor, [*Generating High-Performance Tensor Programs for Deep Learning*](https://arxiv.org/abs/2006.06762): why schedules are tuned per target

 *  try    Sweep every option, then tell me where the model and the measurements disagree and why | Do the same on WebGPU and compare the correlation

// The greedy compile ranks a fork's options with an analytic cost model (std.tile.estimate) and takes the
// best. Autotuning instead measures. This project's check scores the model against whatever has been
// measured for this kernel on the current device: Spearman's rank correlation \u03C1 between predicted and
// measured times, and the regret (the measured time of the model's favourite \xF7 the best measured time).
// Run the sweep from the Notes, read the check in the Code view, then try a real GPU (WebGPU).
const rows = param.int("rows", { min: 64, max: 8192, default: 2048, scale: "log" });
const dim = param.int("dim", { min: 256, max: 8192, default: 8192, scale: "log" });

const spearman = (a, b) => {
  const rank = (v) => { const o = v.map((x, i) => [x, i]).sort((p, q) => p[0] - q[0]); const r = []; o.forEach(([, i], j) => (r[i] = j)); return r; };
  const ra = rank(a), rb = rank(b), n = a.length;
  let d2 = 0;
  for (let i = 0; i < n; i++) d2 += (ra[i] - rb[i]) ** 2;
  return 1 - (6 * d2) / (n * (n * n - 1));
};

project("model-vs-measurement")
  .params(rows, dim)
  .program(({ x }) => ({ y: N.softmax(x, -1) }), ({ param }) => ({ x: k.tensor([param(rows), param(dim)]) }))
  .check("the cost model, scored against this device's measurements", ({ run }) => {
    const { store, deviceId, target } = run.ctx;
    const d = run.decisions.find((x) => x.rule === "schedule");
    const measured = store ? store.list({ device: deviceId, identity: d.key }).filter((r) => r.ok !== false) : [];
    if (measured.length < 3) return { ok: true, message: \`\${measured.length} of \${d.size} options measured on \${deviceId}: sweep them all to score the model\` };
    const g = run.at("loop"), n = g.nodes.get(d.node);
    const an = std.tile.analyze(n.attrs.expr, n.attrs.shape, n.args.map((a) => g.nodes.get(a).type.shape));
    const model = measured.map((r) => std.tile.estimate(an, r.knobs, target).us);
    const us = measured.map((r) => r.us);
    // the model's favourite, with the same tie-break the compile uses (lowest score, then knobs in canonical order)
    const order = measured.map((r, i) => i).sort((a, b) => model[a] - model[b] || (k.knobs.canonical(measured[a].knobs) < k.knobs.canonical(measured[b].knobs) ? -1 : 1));
    const iModel = order[0], best = Math.min(...us), iBest = us.indexOf(best);
    return { ok: true, message: \`\${measured.length} of \${d.size} options measured on \${deviceId} \xB7 Spearman \u03C1 = \${spearman(model, us).toFixed(3)} \xB7 the model's favourite \${measured[iModel].row} measured \${us[iModel].toFixed(1)} \xB5s; the best measured \${measured[iBest].row} \${best.toFixed(1)} \xB5s \xB7 regret \${(us[iModel] / best).toFixed(2)}\xD7\` };
  });
`,notes:`# The cost model vs. the measurements

A compiler that has to choose between schedules can **predict** (with a cost model) or **measure** (by autotuning). This project measures every schedule the compiler could pick for one kernel, then scores the cost model against the measurements. Neither the model nor the simulator is ground truth, and seeing where they disagree is the lesson.

> **Try it**
> 1. [Sweep every option](lab:tune?strategy=sweep-all&budget=32). It compiles and measures 27 programs, about a minute on the simulator.
> 2. Read the score in the [Code view's checks](lab:view?name=code).
> 3. Open [Knobs](lab:view?name=knobs), choose the \`schedule\` fork, and sort by *Model*, then by *Measured*.
> 4. If your browser has WebGPU, [switch to it](lab:device?id=webgpu) and sweep again: the same score, on real hardware.

## How a greedy compile decides

At every fork the decide policy ranks the options and takes the first legal one. The standard chain is:

1. **pins** (yours),
2. **evidence**: the fastest *measured* option on this device, once the cost model's favourite has been measured too (so that measuring one pinned schedule cannot lock it in after you unpin),
3. **the cost model**, \`std.tile.estimate\`: analytic counts of flops, DRAM and L2 bytes, shared-memory wavefronts and warp instructions, turned into time by the roofline-plus-occupancy model,
4. **first**.

After the sweep the compile switches from \`by: model\` to \`by: evidence\`. Measurement overrides prediction.

## The maths: scoring a cost model

What matters is not the absolute error of the predictions but whether the model **ranks** options correctly, because the compiler only uses the ranking.

**Spearman's rank correlation.** Rank the $n$ measured options by predicted time and by measured time. With $d_i$ the difference of option $i$'s two ranks,

$$\\rho = 1 - \\frac{6 \\sum_i d_i^2}{n(n^2 - 1)}$$

$\\rho = 1$ is a perfect ranking, $0$ no relation, $-1$ reversed.

**Regret.** The cost of trusting the model:

$$\\text{regret} = \\frac{t_\\text{measured}(\\text{model's favourite})}{\\min_i t_\\text{measured}(i)} \\;\\ge\\; 1$$

A model can have a high $\\rho$ and still a bad regret if it mis-orders the top few, and only the top matters. Autotuning papers report both, often as "fraction of optimal".

## What you should see

Simulated RTX 5090, softmax over 2048 \xD7 8192:

- All 27 options: **\u03C1 \u2248 0.99**. The 15 thread-per-element schedules are about 1000\xD7 slower than the row schedules (each thread re-reads its whole row to compute its own copy of the row max and sum), and both model and simulator agree on that. Easy cases inflate $\\rho$.
- **Regret 1.19\xD7.** The model's favourite, \`MAP=row,TPB=1024\` without staging, measures 99.5 \xB5s. The best measured, \`MAP=row,TPB=1024,STAGE=reused\`, takes 83.3 \xB5s.
- Restrict attention to the 12 row schedules ([pin them one by one](lab:view?name=knobs), or sweep on a fresh device) and **\u03C1 drops to about 0.92**.

### Why they disagree

The softmax reads each row three times. Without staging, the second and third reads go to memory. Do they hit L2 or DRAM? The two sides use different heuristics:

- **The cost model** counts the data a kernel touches, 64 MiB, which fits in the 96 MB L2. So it assumes almost every re-read hits L2, and staging buys nothing.
- **The simulator** counts input *and* output, 128 MiB, which does not fit. So it sends 60% of the re-read traffic to DRAM, and staging saves 19%.

Neither is the hardware. A real GPU's L2 behaviour depends on what else is in flight. Here a row is 32 KiB and about 170 rows are active at once, roughly 5 MB, so the re-reads of a row happen within microseconds and almost certainly hit L2. **The analytic model is probably closer to a real GPU here.** That's a hypothesis you can test: sweep on WebGPU and see whether staging still wins on your GPU.

### Why the simulator mostly agrees with the model

Both convert counts to time with the same function (\`timeModel\`). The simulator executes the kernel and counts real events: every sector, every bank conflict, every divergent branch. The model computes the same counts analytically. Where the analytic counting is exact \u2014 tiled matmuls, where the model replicates the kernel's shared-memory address arithmetic \u2014 $\\rho$ is 1.0. Where it relies on heuristics \u2014 cache reuse, as here \u2014 they drift apart. What the simulator does *not* check is the time model itself. Only real hardware does that.

## Autotuning: search strategies

- **Sweep top 6.** Measure the model's six best options for each kernel: cheap, and good when the model's top 6 contain the true best.
- **Sweep all.** Exhaustive. Feasible here (27 options) but not for a tiled matmul (645 options in W-08, and multiplied across kernels).
- **SP-MCTS** (single-player Monte Carlo tree search) over the whole program's fork tree, following the CloudRift post. It keeps per-node *max* rewards (single-player games care about the best line, not the average), normalizes UCB by the best time so far, and stops after a patience budget. It spends measurements where the evidence says improvements are.

Production autotuners combine both ideas. TVM's AutoTVM and Ansor train a **learned** cost model (gradient-boosted trees) on measurements and use it to choose what to measure next. MetaSchedule makes the search space a probabilistic program. Every measurement here is stored as evidence, so tuning results persist across compiles for this device.

## Takeaways

1. Judge a cost model by ranking ($\\rho$) and by regret, not by absolute error.
2. Cost models are most wrong about caches, contention and the like: anything not counted exactly. Know which parts of yours are heuristics.
3. Measure the top candidates on the target. The evidence then outranks the model.

## Exercises

1. Make the cost model's L2 heuristic match the simulator's (in \`std/tile.js\`, \`estimate\`, the \`dram = \u2026\` line). Re-run the sweep: does the regret go to 1.00\xD7? Is that an improvement?
2. Run [SP-MCTS with budget 12](lab:tune?strategy=spmcts&budget=12). How many measurements does it need to find the 83.3 \xB5s schedule?
3. Write a decide policy that tries the model's top 3 options and picks the best *measured* one (\`k.decide.cost\` with \`run.ctx.store\`).

## Further reading

- Chen et al., [AutoTVM: *Learning to Optimize Tensor Programs*](https://arxiv.org/abs/1805.08166)
- Zheng et al., [Ansor](https://arxiv.org/abs/2006.06762) \xB7 Shao et al., [MetaSchedule](https://arxiv.org/abs/2205.13603)
- Haj-Ali et al., [ProTuner: tuning programs with Monte Carlo tree search](https://arxiv.org/abs/2005.13685)
- Kaufman et al., [*A Learned Performance Model for Tensor Processing Units*](https://arxiv.org/abs/2008.01040)
- CloudRift, [*Building a GPU compiler from scratch*, part 3](https://www.cloudrift.ai/blog/building-gpu-compiler-from-scratch-3): the SP-MCTS this project implements

k.graph(name, b => { const x = b.input("x", type); b.output("y", f(x)); })
Graph: nodes (Map id \u2192 Node), inputs [{name, id}], outputs [{name, id}], size, topo(), users(id), value(id),
  find(op | pred), findAll(op | pred), findBefore(id, pred), print({ body, types, only }), printNode(id),
  eval(inputs) \u2192 { outputName: value }, key(), nodeKey(id), summary() \u2192 { op: count }, clone(), dce()
Node (frozen): id, def, name ("dialect.op"), args [ids], attrs, type, knobs
Value (what rules and traced code see): id, node, name, opName, type, shape, attrs, knobs, args, users,
  arg(i | "name"), is(op | value), has(trait), isConst(v?), value, isInput(), otherArg(v), graph, print(), key(),
  fold(), with({ args, attrs, def }), lower(Op({ attrs }) | Op, attrs?)
Node ids look like n12; inputs print by name.

## 4 Patterns
P.op("arith.mul" | D.mul, \u2026)  P.oneOf(\u2026)  P.trait("pure")  P.const(v?)  P.any()  P.var(name)
  .as(name) capture \xB7 .where(ctx => bool) \xB7 .args(p1, p2) \xB7 .attrs({ fn: "div" }) \xB7 .oneUse()
P.chain(pInner, pOuter)   producer \u2192 consumer (the inner has one use); the root is the outer node
Rules by example: k.rule(name).from(({ x }) => x.mul(2)).to(({ x }) => x.add(x))

## 5 Rules
k.rule(name)
  .match(pattern)
  .rewrite(ctx => result)     ctx: the captures, node, graph, param(p), ctx (target, deviceId, store\u2026), run, skip,
                              edit (graph surgery: edit.node(Op, args, attrs), edit.replace(a, b), edit.remove(v))
     result: a value (replace the root), node.with({\u2026}) or node.lower(\u2026) (rewrite in place),
             k.fork([...]) or an array of options (a choice), undefined (no change)
  .mutate(({ tx, ...ctx }) => \u2026)   imperative: tx.set(v, { attrs, args, def }), tx.replace(a, b), tx.remove(v)
  .when(ctx => bool)          a cheap precondition (declines silently)
  .guard(({ before, after, root, node, ctx, run }) => true | "why")   veto after the rewrite; the Trace shows why
  .requires(ruleName)         only after that rule has fired somewhere   .describe(text)
skip("reason") inside rewrite declines visibly: Trace \u2192 Declined lists it with the reason.
A rewrite runs inside a fresh scope: build new nodes with dialect calls; they are added to the graph.
rule.applyTo(graph) \u2192 { changed, graph, run }   rule.explain(graph) \u2192 where it matches

## 6 Passes and pipelines
k.pass(name).short("x").rules(...rules)
  .mode("fixpoint" | "once" | "ordered-once")   .order("topo" | "reverse")   .limit(maxSteps)
  .knobs(...params)   the knobs its forks use (shown in Knobs; pinnable for every kernel)
  .whole(({ graph, edit, param, ctx, run, skip }) => \u2026)   a whole-graph pass: mutate with edit, or return a new Graph
     edit.node(Op, [args], attrs) \xB7 edit.replace(old, new) \xB7 edit.replaceAll(v) \xB7 edit.setOutputs({ name: v }) \xB7 edit.remove(v)
  .check((graph, run) => true | "why")   a post-condition; failing it stops the compile (PassCheckError)
  .helpers(name, obj) \xB7 .describe(text)
k.pipeline(name)
  .ir(name, { dialects: [D1, D2], strict: true })   a checkpoint: strict fails the compile (LoweringError, naming
                                                     the nodes and the last rule that declined each) if any op is
                                                     outside the dialects
  .pass(p) \xB7 .params(...p) \xB7 .decide(policy) \xB7 .target(t) \xB7 .use(strategy) \xB7 .describe(text) \xB7 .build()
Pipeline: passes, irNames(), pass(name), allParams(), describe(), run(graph, { params, decide, target, ctx, upTo, passes }),
  with({ decide, target, name, use }), insertAfter(passName, pass), insertBefore(passName, pass), replace(passName, passes),
  without(passName), withIr(name, opts), insertRule(passName, rule, { before, after }), replaceRule(passName, ruleName, rule),
  removeRule(passName, ruleName). Passes are named by full name or short letter.
Run: ok, error {kind, message}, graph (final), at(irName) \u2192 Graph, irOrder, steps [{ i, kind "rewrite"|"skip", pass,
  short, rule, node, added, removed, changed, before, after, decision, reason }], decisions [{ pass, rule, node, key,
  options [{ knobs, label, score }], size, by, knobs, chosen, tried }], passStats { pass: { applied, skipped, forks, ms } },
  warnings, events, params (ParamSet), ms, diff(i), stepGraph(i)

## 7 Parameters, knobs, forks, decisions
param.int(name, { min, max, step, default, scale: "log", help })   param.float(\u2026)   param.enum(name, [values], { default, off })
param.bool(name, { default, off })   param.text(name, { default })   .phase("build" | "run") .group(g) .help(text)
Read them: in programs via ({ param }) => param(p); in rules and passes via ctx.param(p) (recorded as reads);
anywhere via run.params.get(p). A pinned param fixes a fork knob everywhere it is offered.
Forks (a rule returns several options; the decide policy picks one per node):
  k.fork([optionFn | { knobs, label, build }]).keepOriginal(param)
  k.fork.over(PARAM, [values]?, v => result)          one option per value
  k.fork.toggle(PARAM, () => result)                  apply or keep the original (PARAM.off)
  k.fork.tree().level(P1, (knobsSoFar, rctx) => values).level(P2, \u2026).leaf(knobs => result)
Decide policies rank options: { order, by, scores } or null to pass:
  k.decide.pinned()  k.decide.evidence(store?, { always })  k.decide.cost(({ knobs, node, fork, ctx, run }) => number | Infinity, { name }).for("ruleName")
  k.decide.first()  k.decide.random(seed)  k.decide.exactly(fp => index | knobs)  k.decide.strict()  k.decide.chain(...)
An option that throws skip(\u2026), fails validate, or fails a guard is tried no further; the next ranked one is.
In a chain, evidence (fastest measured option) decides only once the next policy's favourite has been measured
too, so measuring one pinned schedule never locks it in after unpinning ({ always: true }: the plain rule).
k.knobs.canonical({ \u2026 }) \u2192 "A=1,B=2"   k.knobs.parse(str)
Strategies listen to compile events: k.strategy(name).state(() => s).on("rewrite" | "skip" | "fork" | "decided" | "ir" |
  "passStart" | "passEnd" | "*", (ev, s, run) => \u2026).expose(s => \u2026); pipeline.use(strategy); run.strategy(name)

## 8 The ML stack (std)
N \u2014 the frontend (dialect nn, PyTorch-like, every op with reference semantics, broadcasting):
  N.add sub mul div max min pow \xB7 exp log sqrt rsqrt tanh sigmoid relu abs neg square sin cos \xB7 gt lt select(c, a, b)
  N.sum(x, axis = -1, keepdim = true) \xB7 N.amax \xB7 N.mean \xB7 N.matmul(a, b) (batched) \xB7 N.linear(x, W[out, in], b?)
  N.rms_norm(x, w, { eps }) \xB7 N.layer_norm(x, g, b, { eps }) \xB7 N.softmax(x, dim) \xB7 N.gelu \xB7 N.silu
  N.transpose(x, d0 = -2, d1 = -1) \xB7 N.reshape(x, shape) \xB7 N.slice(x, axis, start, end) \xB7 N.ew(fnName, ...xs)
  std.weight(name, shape, { seed, scale, init: "normal" | "ones" | "zeros" }) \u2014 a constant tensor (deterministic)
  values have methods: x.add(y), x.matmul(w), x.softmax(), x.sum(-1), x.t(), x.reshape([\u2026]) \u2026
T \u2014 Tensor IR builders (dialect tensor: const, ew, reduce, view; broadcasting by explicit views):
  T.ew(fnName, ...xs) \xB7 T.add \u2026 (same names as N) \xB7 T.recip \xB7 T.reduce(x, fn, axis) \xB7 T.sum(x, axis) \xB7 T.max(x, axis)
  T.view(x, shape, coords => [inputCoords]) \xB7 T.bc(x, shape) \xB7 T.reshape(x, shape) \xB7 T.squeeze(x, axis)
  Elementwise functions (std.FNS: js, c, wgsl, flops): add sub mul div max min pow gt lt select neg exp log sqrt rsqrt
  tanh sigmoid relu abs sin cos recip square fma (fma(a, b, c) = a\xB7b + c; the optimizer contracts single-use
  mul+add into it, so issue-bound kernels count FFMA as on real GPUs). Add one: std.FNS.myfn = { n, js, c: "\u2026{0}\u2026", w: "\u2026", flops }.
  Reducers: add max min mul (std.REDUCERS).
ix \u2014 affine index expressions for maps: ix.C(3), ix.V("a0"), e.add/sub/mul/div/mod/min/max, ix.map(n, a => [...]),
  ix.print(e). Coordinates are a0, a1, \u2026
std.decompose(opName, ({ ...args, ...attrs, out, T }) => tensorValue) \u2192 a rule for the decomposition pass

std.emmy.pipeline({ target, store }) \u2014 the standard pipeline:
  torch [nn, tensor] \u2500d frontend/decomposition\u2192 tensor [tensor, strict]
  \u2500o frontend/optimization (compose views, fold splats) \u2500l loop/lowering (lift ew/reduce/view to loop kernels)
  \u2500f loop/fusion (inline producers into consumers, consumers first; guard: no work blowup) \u2500s loop/stamp (names)
  \u2192 loop [loop.kernel: a scheduled expression; LICM places each value at the deepest loop it depends on]
  \u2500t tile/schedule (fork over MAP=thread|row|tiled \xD7 TPB COARSEN STAGE BM BN BK TM TN) \u2192 tile
  \u2500k kernel/materialize (threads, shared-memory staging, tree reductions, register tiles, syncs) \u2192 kernel
  \u2500c gpu/emit \u2192 gpu [gpu.kernel with CUDA and WGSL]
  std.emmy.passes, std.emmy.dialects ({ nn, tensor, loop, tile, kernel, gpu }), std.emmy.defaultDecide(store)
  default decide: kernel pins (Knobs) \u2192 global pins \u2192 evidence on this device \u2192 std.tile.costPrior (model) \u2192 first
Schedules (knobs): MAP thread (one output per thread; TPB, COARSEN) \xB7 row (a block per row with cooperative
  reductions; TPB, STAGE none|reused|all stages inputs in shared memory) \xB7 tiled (contractions: BM\xD7BN outputs per
  block, BK slices of K in shared memory, TM\xD7TN outputs per thread). Legality depends on the target (threads per
  block, shared memory per block = 48 KiB static).
std.loop: E (expressions: E.num, E.load(i, idx), E.op(fn, \u2026), E.red(fn, r, n, body)), schedule(expr, shape),
  printNest, workOf, inlineInto, mergeLoopOps, lift, fuse, stamp
std.tile: analyze(expr, shape, inShapes) \u2192 { rows, contraction, \u2026 }, estimate(analysis, knobs, target) \u2192 { us, bound,
  occupancy, parts }, timeModel, costPrior, legalMaps, forkTree, canonRow(knobs), KNOBS
std.kernel: materialize(node), KB (kernel builder: let, int, load, store, shared, sload, sstore, sync, for, if), kx
std.gpu: toCuda(K), toWgsl(K), toSim(K), programOf(graph) \u2192 { kernels: [{ name, K, cuda, wgsl, grid, \u2026 }] },
  simulateKernel(kernel, target) \u2192 { metrics, check }
std.targets: rtx5090 rtx4090 h100 a100 orin \xB7 std.target(spec) \xB7 std.Store \xB7 std.tune \xB7 std.measureProgram

## 9 Devices, measurement, tuning
sim:<gpu>  a lockstep SIMT simulator runs sampled blocks; metrics: time (roofline + occupancy model: dram, l2,
           compute, smem, issue bounds, launch, waves), occupancy and its limiter, load sectors per request (4 = fully
           coalesced fp32), shared-memory bank conflicts, branch divergence, barriers, out-of-bounds and divergent-barrier
           detection, and a check of every sampled output against the Loop IR reference
webgpu     your GPU through WebGPU: real time (timestamp queries when allowed), real outputs checked
cuda       kiln_runner.py on an NVIDIA box: nvcc, CUDA events (median of 50), optional Nsight Compute metrics; live when
           the page is served by the runner, otherwise export a bundle (Devices) and import the results
Inputs are seeded uniform values in [\u22121, 1) (mulberry32), identical on every device.
Every measurement records evidence (device, kernel identity, schedule row \u2192 \xB5s). The next compile prefers the
fastest measured row. Tune: SP-MCTS over the program's whole fork tree (max-Q backup, UCB normalized by the best
time, patience), a sweep of the model's top 6 options per kernel ("sweep"), or every option ("sweep-all").

  lab:unpin[?name=TPB,STAGE]           unpin                  lab:measure[?all=sim]   measure (on every simulated GPU)
  lab:tune?strategy=spmcts|sweep|sweep-all&budget=32          lab:device?id=sim:h100[&measure]       lab:compile
  lab:view?name=perf|knobs|trace|kernels|code|notes|\u2026         lab:ir?name=loop \xB7 lab:node?id=n12&ir=loop
  lab:step?i=14 \xB7 lab:kernel?name=k_x \xB7 lab:fork?i=0 \xB7 lab:line?n=12 \xB7 lab:preset?id=W-21
Values are URL-encoded (spaces as %20, | as %7C). A good tutorial: the concept, the maths, what to try (as lab:
links), what the user should see (measured numbers), why, exercises, further reading.
`,On=`You are the agent inside Kiln Workbench: a browser IDE for building compilers and the programs they compile. Users write a project script (JavaScript) that defines dialects, rules, passes, pipelines and a program; the workbench traces the program, runs the pipeline, shows every IR level, every rewrite and every fork, generates CUDA and WGSL for the standard ML pipeline, and measures kernels on simulated GPUs, WebGPU or a CUDA box. You work through one tool, eval, with the same API the scripts use.

HOW TO WORK
\u2022 Look before you change: wb.context(), editor.get(), ir.levels(), ir.text(level, { bodies: false }), trace.passes(), trace.steps({ declined: true }), forks.list(), kernels.list(). Then act, then show the evidence.
\u2022 Answer questions about this compile from the run itself, not from memory: what a pass did (trace.steps, trace.step(i).diff), why a rule did not fire (trace.steps({ rule, declined: true }) gives the skip reason; trace.why(nodeId)), why a schedule was picked (forks.get(i): every option's model time and measured time, and "by"), why a kernel is slow (await measure(): bound, occupancy and its limiter, sectors per request, bank conflicts, divergence).
\u2022 A new project or a rewrite: write the COMPLETE script with editor.set(text). It compiles at once and returns {ok, errors (with line numbers), warnings, compile, check}. Fix errors and set again, at most 4 rounds. editor.edit(find, replace) for surgical changes.
\u2022 Experiment without touching the editor: editor.check(text) compiles a script in isolation and returns live run and prog objects; or build graphs, rules and pipelines directly with k, P, std, N, T and run them (pipeline.run(graph)).
\u2022 A new pass for the ML pipeline: write rules over Tensor IR (tensor.ew/reduce/view; T helpers) or Loop IR, put them in k.pass(\u2026), and insert with std.emmy.pipeline().insertAfter("frontend/optimization", pass) or .insertRule(passName, rule). A rewrite that is not always a win should be a fork (k.fork.toggle(PARAM, \u2026) or k.fork.over) so it can be pinned, ranked and tuned. Prove it: the end-to-end check must still pass, and measure before and after.
\u2022 A new IR or a whole new compiler: a dialect per level with eval on every op (so every level can be checked), strict checkpoints between levels, rules for local rewrites and whole() passes for global algorithms (allocation, scheduling, code generation). See W-03 and W-17.
\u2022 A new frontend op: an op with eval (the reference) and infer, plus std.decompose(\u2026) inserted into "frontend/decomposition", plus the dialect added to the torch checkpoint with pipeline.withIr. See W-16.
\u2022 Performance work: measure first (await measure()), read the bound and the metrics, then change one thing (pin a row with forks.pin, change a param, add a pass) and measure again. Use await tune({ budget }) for a search; it records evidence, after which compiles pick measured rows ("by: evidence"). Simulated times come from a model: say so when you report them, and suggest WebGPU or the CUDA runner for real numbers.
\u2022 Never invent API. If something is not in the reference, build it from what is (a dialect, a rule, a whole pass, a decide policy).

No Python packages are needed: inputs are generated on the host by the same mulberry32 generator
the workbench uses, inside the compiled harness.

HARNESS = r"""
#include <cstdio>
#include <cstdlib>
#include <cstdint>
#include <cmath>
#include <cuda_runtime.h>

%(kernel)s

#define CK(x) do { cudaError_t e_ = (x); if (e_ != cudaSuccess) { printf("\\n{\\"error\\": \\"%%s at line %%d\\"}\\n", cudaGetErrorString(e_), __LINE__); return 1; } } while (0)

// mulberry32, exactly as the workbench: value = r * 2 - 1, rounded to float
static float* gen(size_t n, uint32_t seed) {
    float* h = (float*)malloc(n * sizeof(float) + 4);
    uint32_t a = seed;
    for (size_t i = 0; i < n; i++) {
        a += 0x6D2B79F5u;
        uint32_t t = a;
        t = (t ^ (t >> 15)) * (t | 1u);
        t ^= t + (t ^ (t >> 7)) * (t | 61u);
        uint32_t r = t ^ (t >> 14);
        h[i] = (float)((double)r / 4294967296.0 * 2.0 - 1.0);
    }
    return h;
}

static const size_t IN_SIZES[] = { %(in_sizes)s };
static const uint32_t IN_SEEDS[] = { %(in_seeds)s };
static const size_t SAMPLES[] = { %(samples)s };

int main(int argc, char** argv) {

def build(source, tag, arch, nvcc):
    """Compile once per source; returns (binary path, registers or None)."""
    CACHE.mkdir(parents=True, exist_ok=True)
    h = hashlib.sha1((source + arch).encode()).hexdigest()[:16]
    exe = CACHE / f"{tag}-{h}"
    regs_file = CACHE / f"{tag}-{h}.regs"
    if exe.exists():
        return str(exe), (int(regs_file.read_text()) if regs_file.exists() and regs_file.read_text().strip() else None)
    cu = CACHE / f"{tag}-{h}.cu"
    cu.write_text(source)
    cmd = [nvcc, "-O3", "-std=c++14", f"-arch={arch}", "-Xptxas", "-v", "-o", str(exe), str(cu)]
    r = subprocess.run(cmd, capture_output=True, text=True)
    if r.returncode != 0:
        raise RuntimeError("nvcc failed:\\n" + (r.stderr or r.stdout)[-3000:])
    m = re.findall(r"Used (\\d+) registers", r.stderr)
    regs = int(m[-1]) if m else None
    regs_file.write_text(str(regs) if regs is not None else "")
    return str(exe), regs


_device = None


def device_info(arch, nvcc):
    global _device
    if _device is None:
        exe, _ = build(DEVICE_QUERY, "devquery", arch, nvcc)
        r = subprocess.run([exe], capture_output=True, text=True, timeout=60)
        _device = json.loads(r.stdout.strip() or '{"error": "device query printed nothing"}')
        if "error" in _device:
            raise RuntimeError(_device["error"])
    return _device


def kernel_name(src):
    m = re.search(r"__global__\\s+void\\s+(?:__launch_bounds__\\s*\\([^)]*\\)\\s*)?(\\w+)\\s*\\(", src)
    if not m:
        raise ValueError("no __global__ function in the kernel source")
    return m.group(1)


def run_kernel(k, reps, warmup, arch, nvcc, ncu):
    name = kernel_name(k["source"])
    nin = len(k["inputs"])
    src = HARNESS % {
        "kernel": k["source"], "name": name, "nin": nin, "reps": reps, "warmup": warmup,
        "in_sizes": ", ".join(str(int(i["size"])) for i in k["inputs"]) or "0",
        "in_seeds": ", ".join(f"{int(i['seed']) & 0xffffffff}u" for i in k["inputs"]) or "0u",
        "samples": ", ".join(str(int(s)) for s in k["samples"]) or "0",
        "out": int(k["out"]), "grid": int(k["grid"]), "block": int(k["block"]),
        "args": ", ".join([f"d_in[{i}]" for i in range(nin)] + ["d_out"]),
    }
    exe, regs = build(src, re.sub(r"\\W", "_", k["name"])[:40], arch, nvcc)
    r = subprocess.run([exe], capture_output=True, text=True, timeout=300)
    line = (r.stdout.strip().splitlines() or ["{}"])[-1]
    out = json.loads(line)
    if "error" in out:
        raise RuntimeError(out["error"])
    us = out["us_all"]
    res = {"name": k["name"], "identity": k.get("identity"), "us_median": statistics.median(us), "us_min": min(us), "us_all": us, "samples": out["samples"], "regs": regs}
    if ncu:
        res["ncu"] = profile(exe)
    return res


def profile(exe):
    tool = shutil.which("ncu")
    if not tool:
        return {"ncu_error": "ncu not on PATH"}
    cmd = [tool, "--csv", "--metrics", ",".join(NCU_METRICS.values()), exe, "1", "0"]
    r = subprocess.run(cmd, capture_output=True, text=True, timeout=600)
    rows = [l for l in r.stdout.splitlines() if l.startswith('"')]
    if len(rows) < 2:
        return {"ncu_error": (r.stderr or r.stdout)[-300:]}
    import csv
    vals = {}
    for row in csv.DictReader(rows):
        vals[row.get("Metric Name")] = (row.get("Metric Value") or "").replace(",", "")
    out = {}
    for key, metric in NCU_METRICS.items():
        v = vals.get(metric)
        try:
            out[key] = float(v)
        except (TypeError, ValueError):
            pass
    if out.get("ncu_ld_requests"):
        out["ncu_ld_sectors_per_req"] = out["ncu_ld_sectors"] / out["ncu_ld_requests"]
    if "ncu_duration_us" in out:
        out["ncu_duration_us"] /= 1000.0      # ncu reports ns
    return out


def run_bundle(bundle, arch, nvcc, ncu=False):
    if bundle.get("format") != "kiln-bundle/1":
        raise ValueError("not a kiln bundle (format kiln-bundle/1)")
    dev = device_info(arch, nvcc)
    reps, warmup = int(bundle.get("reps", 50)), int(bundle.get("warmup", 5))
    ncu = ncu or bool(bundle.get("ncu"))
    results = []
    for k in bundle["kernels"]:
        t0 = time.time()
        try:
            res = run_kernel(k, reps, warmup, arch, nvcc, ncu)
            log(f"  {k['name']:<36} {res['us_median']:9.2f} us  ({time.time() - t0:.1f} s)")
        except Exception as e:  # report per kernel; keep going
            res = {"name": k["name"], "identity": k.get("identity"), "error": str(e)[-2000:]}
            log(f"  {k['name']:<36} ERROR {str(e).splitlines()[0][:100]}")
        results.append(res)
    return {"format": "kiln-results/1", "device": dev, "kernels": results, "created": time.strftime("%Y-%m-%dT%H:%M:%S")}


def default_arch():
    return os.environ.get("KILN_ARCH", "native")


# ------------------------------------------------------------------ serve
def serve(html, host, port, arch, nvcc, ncu):
    page = Path(html).read_bytes() if html else None

    class H(BaseHTTPRequestHandler):
        def _send(self, code, body, ctype="application/json"):
            b = body if isinstance(body, bytes) else json.dumps(body).encode()
            self.send_response(code)
            self.send_header("content-type", ctype)
            self.send_header("content-length", str(len(b)))
            self.send_header("cache-control", "no-store")
            self.end_headers()
            self.wfile.write(b)

        def _same_origin(self):
            origin = self.headers.get("Origin")
            return origin is None or origin == f"http://{self.headers.get('Host')}"

        def do_GET(self):
            if self.path in ("/", "/index.html", "/kiln-workbench.html"):
                if not page:
                    return self._send(404, b"start the runner with the workbench page: kiln_runner.py serve kiln-workbench.html", "text/plain")
                return self._send(200, page, "text/html; charset=utf-8")
            if self.path == "/api/device":
                if not self._same_origin():
                    return self._send(403, {"error": "cross-origin request refused"})
                try:
                    return self._send(200, device_info(arch, nvcc))
                except Exception as e:
                    return self._send(500, {"error": str(e)})
            self._send(404, {"error": "not found"})

        def do_POST(self):
            if self.path != "/api/run":
                return self._send(404, {"error": "not found"})
            if not self._same_origin() or not (self.headers.get("content-type") or "").startswith("application/json"):
                return self._send(403, {"error": "refused: same-origin application/json only"})
            n = int(self.headers.get("content-length") or 0)
            if n > 64 * 1024 * 1024:
                return self._send(413, {"error": "bundle too large"})
            try:
                bundle = json.loads(self.rfile.read(n))
                log(f"run: {len(bundle.get('kernels', []))} kernels")
                return self._send(200, run_bundle(bundle, arch, nvcc, ncu))
            except Exception as e:
                return self._send(400, {"error": str(e)})

        def log_message(self, fmt, *args):
            pass

    if host not in ("127.0.0.1", "localhost", "::1"):
        log(f"WARNING: serving on {host}: anyone who can reach this port can run CUDA code on this machine")
    srv = ThreadingHTTPServer((host, port), H)
    try:
        info = device_info(arch, nvcc)
        log(f"device: {info.get('name')} (sm_{info.get('cc', '?').replace('.', '')}, {info.get('sms')} SMs)")
    except Exception as e:
        log(f"device query failed: {e}")
    log(f"Kiln runner: open http://{host}:{port}/  (Ctrl-C stops)")
    srv.serve_forever()


def main():
    ap = argparse.ArgumentParser(description=__doc__, formatter_class=argparse.RawDescriptionHelpFormatter)
    sub = ap.add_subparsers(dest="cmd", required=True)
    for name in ("device", "run", "serve"):
        p = sub.add_parser(name)
        p.add_argument("--arch", default=default_arch(), help="nvcc -arch (default: native, or $KILN_ARCH)")
        if name == "run":
            p.add_argument("bundle")
            p.add_argument("-o", "--out", default="results.json")
            p.add_argument("--ncu", action="store_true", help="also profile each kernel with Nsight Compute")
        if name == "serve":
            p.add_argument("html", nargs="?", default="kiln-workbench.html")
            p.add_argument("--host", default="127.0.0.1")
            p.add_argument("--port", type=int, default=8765)
            p.add_argument("--ncu", action="store_true")
    a = ap.parse_args()
    nvcc = find_nvcc()
    if a.cmd == "device":
        print(json.dumps(device_info(a.arch, nvcc), indent=1))
    elif a.cmd == "run":
        bundle = json.loads(Path(a.bundle).read_text())
        log(f"{len(bundle['kernels'])} kernels")
        res = run_bundle(bundle, a.arch, nvcc, a.ncu)
        Path(a.out).write_text(json.dumps(res))
        log(f"wrote {a.out}: import it in the workbench (Devices \u2192 Import results)")
    else:
        html = a.html if Path(a.html).exists() else None
        if not html:
            log(f"{a.html} not found: the API works, but / will not serve the workbench")
        serve(html, a.host, a.port, a.arch, nvcc, a.ncu)


if __name__ == "__main__":
    main()
