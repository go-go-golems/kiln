`,notes:`# Softmax in one kernel

Softmax is the classic case for fusion with reductions: two reductions and three elementwise ops per row become one kernel with three sweeps, reading the row from DRAM once.

> **Try it** \u2014 read the [loop IR](lab:ir?name=loop) (three sweeps, in order), then the [CUDA](lab:view?name=kernels), then [measure](lab:measure).

## The maths: the safe softmax

$$\\operatorname{softmax}(x)_j = \\frac{e^{x_j - m}}{\\sum_k e^{x_k - m}}, \\qquad m = \\max_k x_k$$

Subtracting the row maximum changes nothing mathematically (it cancels between numerator and denominator), but it keeps $e^{x_j - m} \\le 1$. Without it, $e^{x}$ overflows fp32 at $x > 88.7$, and logits beyond that are common.

The decomposition produces two reductions and three elementwise ops: max, subtract, exp, sum, divide. Fused with loop-invariant code motion, the loop IR becomes

\`\`\`text
for each row:
  m = max_k x[k]                   # sweep 1
  s = \u03A3_k exp(x[k] - m)            # sweep 2
  for each j: y[j] = exp(x[j] - m) / s   # sweep 3
\`\`\`

Three sweeps over the row, one kernel. With the row staged in shared memory, DRAM sees it once: $8\\,\\text{bytes} \\times$ elements in total.

## The system

The tile pass maps a row to a block (\`MAP=row\`) with cooperative reductions for the max and the sum. Whether staging the row in shared memory pays depends on the row length and on occupancy: see W-23. For 1024 \xD7 1024 the cost model's pick runs in 7.9 \xB5s on the simulated RTX 5090, for 8 MiB of DRAM traffic.

## Beyond: online softmax and FlashAttention

Two sweeps are enough: keep a running maximum $m$ and a running sum $s$, and rescale the sum whenever the maximum grows:

$$m' = \\max(m, x_k), \\qquad s' = s \\cdot e^{m - m'} + e^{x_k - m'}$$

This combine is associative, so it fits a parallel tree reduction (Milakov & Gimelshein, 2018). It is also the key step of FlashAttention, which never materializes the attention matrix. This compiler's reducers are \`add\`, \`max\`, \`min\` and \`mul\`; a pair-valued reducer is the extension that would enable both.

## Exercises

1. Remove the max subtraction (write softmax by hand with \`N.exp\` and \`N.sum\`) and feed it inputs around 100. What does the end-to-end check say?
2. How many bytes does the unstaged schedule read per row? [Pin STAGE=none](lab:pin?STAGE=none&measure) and compare the DRAM column. [Unpin](lab:unpin).
3. Write the online-softmax recurrence for a tree reduction: how do two partial results $(m_a, s_a)$ and $(m_b, s_b)$ combine?

## Further reading

- Milakov & Gimelshein, *Online normalizer calculation for softmax* (2018)
- Dao et al., [FlashAttention](https://arxiv.org/abs/2205.14135)
`},{id:"W-07",title:"GELU, pointwise",group:"ML compiler",about:"a chain of elementwise ops becomes one thread-per-element kernel; COARSEN and TPB are the knobs",tries:["Why is this kernel bound by DRAM?","Pin COARSEN=4 and compare"],text:`/** W-07 GELU, pointwise
 *  group  ML compiler
 *  about  a chain of elementwise ops becomes one thread-per-element kernel; COARSEN and TPB are the knobs
 *  try    Why is this kernel bound by DRAM? | Pin COARSEN=4 and compare
 */
// GELU (tanh approximation) on a bias-shifted input: y = gelu(x + b) \xB7 s. Seven elementwise ops, one
// kernel: every thread reads x[i] and b[j] once and writes y[i] once. Arithmetic intensity is ~2 flop/B,
// so on any GPU this kernel lives under the memory roof \u2014 check the Roofline in Perf.
const n = param.int("tokens", { min: 64, max: 65536, default: 8192, scale: "log" });
const d = param.int("hidden", { min: 64, max: 8192, default: 2048, scale: "log" });

project("gelu")
  .params(n, d)
  .program(({ x }, { param }) => {
    const b = std.weight("bias", [param(d)]);
    return { y: N.mul(N.gelu(N.add(x, b)), 0.5) };
  }, ({ param }) => ({ x: k.tensor([param(n), param(d)]) }));
`,notes:`# GELU, pointwise

The simplest GPU kernel shape: every output element depends only on the same element of the inputs. One thread per element (or per few elements), no shared memory, no synchronization. The only question is how fast the bytes move.

> **Try it** \u2014 [measure](lab:measure), then compare thread-mapping options in [Knobs](lab:view?name=knobs): [64 threads per block](lab:pin?TPB=64&COARSEN=1&measure), [1024](lab:pin?TPB=1024&COARSEN=1&measure), [4 elements per thread](lab:pin?TPB=256&COARSEN=4&measure). [Unpin](lab:unpin).

## The maths

$$y = 0.5 \\cdot \\operatorname{GELU}(x + b), \\qquad \\operatorname{GELU}(u) = \\tfrac12 u \\Big(1 + \\tanh\\big(\\sqrt{2/\\pi}\\,(u + 0.044715\\,u^3)\\big)\\Big)$$

About 15 flop per element against 8 bytes (read $x$, write $y$; $b$ is one row, cached): roughly 2 flop/byte. That is well below every GPU's ridge point (W-18), so the kernel is memory-bound:

$$t \\approx \\frac{8 \\cdot 8192 \\cdot 2048\\ \\text{B}}{1792\\ \\text{GB/s}} + 2.5\\ \\mu s = 77.4\\ \\mu s \\quad\\text{(simulated: 77.6 \xB5s)}$$

## The system: thread mapping

\`MAP=thread\` gives each thread \`COARSEN\` consecutive outputs; \`TPB\` threads form a block.

- **Coalescing.** Consecutive threads touch consecutive addresses, so a warp's 32 loads fall into 4 sectors of 32 bytes: perfect. *sectors / request* in Perf should read 4.0.
- **Coarsening.** More elements per thread mean fewer threads and more independent loads per thread: more instruction-level parallelism, less index arithmetic. For a memory-bound kernel the gain is small, because the bottleneck is DRAM.
- **Block size.** Small blocks hit the 24-blocks-per-SM limit before the 1536-threads limit (W-23); 64 threads per block or more reach full occupancy.

## Exercises

1. Why is coarsening by 4 not 4\xD7 faster? What would it take for coarsening to matter?
2. Change the scale to a learned per-column vector. How many bytes per element now?
3. Look at the generated WGSL in [Kernels](lab:view?name=kernels): how does it compute the global index when the grid has more than 65,535 blocks?
`},{id:"W-08",title:"Linear layer, tiled",group:"ML compiler",about:"y = x\xB7W\u1D40 becomes a shared-memory tiled matmul with register blocking: BM, BN, BK, TM, TN are the fork",tries:["Which tile shape did the cost model pick, and is it the fastest measured?","Tune with a budget of 48"],text:`/** W-08 Linear layer, tiled
 *  group  ML compiler
 *  about  y = x\xB7W\u1D40 becomes a shared-memory tiled matmul with register blocking: BM, BN, BK, TM, TN are the fork
 *  try    Which tile shape did the cost model pick, and is it the fastest measured? | Tune with a budget of 48
 */
// A contraction: y[m, n] = \u03A3_k x[m, k] \xB7 W[n, k]. The tile pass recognizes the contraction in the Loop IR
// and offers MAP=tiled schedules: each block computes a BM\xD7BN tile, walking K in BK slices staged in
// shared memory; each thread holds a TM\xD7TN register tile. The fork has dozens of legal options; the cost
// model ranks them and Tune measures them. Coalescing-aware loads keep sectors per request near 4.
const M = param.int("M", { min: 64, max: 8192, default: 1024, scale: "log", help: "tokens" });
const K = param.int("K", { min: 64, max: 8192, default: 1024, scale: "log", help: "in features" });
const Nf = param.int("N", { min: 64, max: 8192, default: 1024, scale: "log", help: "out features" });

project("linear")
  .params(M, K, Nf)
  .program(({ x }, { param }) => ({ y: N.linear(x, std.weight("W", [param(Nf), param(K)])) }),
           ({ param }) => ({ x: k.tensor([param(M), param(K)]) }));
`,notes:`# Linear layer, tiled

$y = x W^\\top$: the operation that dominates transformer FLOPs. The tile pass recognizes a **contraction** in the loop IR and offers shared-memory tiled schedules, hundreds of them. This is the compiler's view of what W-21 walks through by hand.

> **Try it** \u2014 open the \`schedule\` fork in [Knobs](lab:view?name=knobs): 645 legal tile shapes, ranked by the cost model. [Measure](lab:measure), then [tune for 32 programs](lab:tune?strategy=spmcts&budget=32) and see whether the measured best differs from the model's pick.

## The maths

$$y_{mn} = \\sum_k x_{mk}\\, W_{nk}, \\qquad W = 2MNK, \\qquad I_\\text{max} = \\frac{2MNK}{4(MK + NK + MN)}$$

At $M = N = K = 1024$ that is 2.1 GFLOP and up to 171 flop/byte: compute-heavy, *if* the schedule reuses data on-chip.

## The system

The tile pass analyzes the loop nest: two operands indexed by $(m, k)$ and $(n, k)$, a sum over $k$, an output over $(m, n)$. Each \`MAP=tiled\` option fixes:

| knob | meaning | effect |
|---|---|---|
| \`BM \xD7 BN\` | output tile per block | global traffic $\\propto 1/B_M + 1/B_N$; fewer blocks |
| \`BK\` | depth of each shared-memory slab | shared memory $= 4 B_K (B_M + B_N)$ bytes |
| \`TM \xD7 TN\` | outputs per thread (register tile) | shared-memory reads per FMA $= (T_M + T_N)/(T_M T_N)$ |

Legality: at most 1024 threads per block, at most 48 KiB of static shared memory, and at least one warp of threads.

The kernel each option produces is in [Kernels](lab:view?name=kernels): a loop over $k$-slabs, cooperative tile loads, a barrier, an unrolled register-tile update, a barrier, and finally the epilogue. In W-09 and W-16 the epilogue includes fused activations.

The cost model's pick runs at about 18 TFLOP/s on the simulated RTX 5090 (119.8 \xB5s), limited by shared-memory bandwidth. W-21 explains why and what comes next.

## Exercises

1. [Make $M = 64$](lab:param?name=M&value=64&measure) (a small batch) and compare the model's pick and its time with $M = 1024$. W-20 explores this axis in depth.
2. Add a bias: \`N.linear(x, W, b)\`. Where does the bias add end up in the kernel?
3. Switch to the [Orin](lab:device?id=sim:orin&measure) (8 SMs): which tile shape does the model pick there, and why does a GPU with fewer SMs prefer bigger tiles? (W-24.)
`},{id:"W-09",title:"MLP and the blowup guard",group:"ML compiler",about:"fusion stops where it would recompute work: a GELU or SwiGLU MLP keeps its matmuls apart",tries:["Why are there exactly these kernels? Show me the guard's decline","Switch act to swiglu"],text:`/** W-09 MLP and the blowup guard
 *  group  ML compiler
 *  about  fusion stops where it would recompute work: a GELU or SwiGLU MLP keeps its matmuls apart
 *  try    Why are there exactly these kernels? Show me the guard's decline | Switch act to swiglu
 */
// Fusing a producer into its consumer inlines the producer's whole computation at every use. For an
// elementwise producer that is free; for a matmul feeding another matmul it multiplies the work by the
// hidden size. The fusion rule's guard compares the work before and after (workOf, with a memory weight)
// and declines: Trace \u2192 Declined shows "would multiply work by \u2026". The activation still fuses into the
// first matmul's epilogue.
const act = param.enum("act", ["gelu", "swiglu"], { default: "gelu" });
const T_ = param.int("tokens", { min: 16, max: 4096, default: 512, scale: "log" });
const D = param.int("dim", { min: 64, max: 4096, default: 512, scale: "log" });
const H = param.int("hidden", { min: 64, max: 8192, default: 1024, scale: "log" });

project("mlp")
  .params(act, T_, D, H)
  .program(({ x }, { param }) => {
    const d = param(D), h = param(H);
    if (param(act) === "gelu") return { y: N.linear(N.gelu(N.linear(x, std.weight("up", [h, d]))), std.weight("down", [d, h])) };
    const g = N.silu(N.linear(x, std.weight("gate", [h, d])));
    return { y: N.linear(N.mul(g, N.linear(x, std.weight("up", [h, d]))), std.weight("down", [d, h])) };
  }, ({ param }) => ({ x: k.tensor([param(T_), param(D)]) }))
  .check("matmuls stay separate kernels", ({ run }) => {
    const ks = run.graph.findAll("gpu.kernel").length;
    return ks >= 2 || \`only \${ks} kernel: fusion recomputed a matmul\`;
  });
`,notes:`# MLP and the blowup guard

Fusion is not always a win. Fusing one matmul into another would **recompute** the first one for every element of the second. A guard in the fusion pass compares the work before and after, and declines. This project shows the guard at work, and where fusion still applies.

> **Try it** \u2014 in [Trace](lab:view?name=trace), turn on *Declined*: \`merge_loop_ops\` declines with *blowup: fused work \u2026 > unfused \u2026*. Then switch the activation to [SwiGLU](lab:param?name=act&value=swiglu) and back to [GELU](lab:param?name=act&value=gelu).

## The maths of recomputation

Take $h = \\operatorname{GELU}(xW_\\text{up}^\\top)$ with $h \\in \\mathbb{R}^{T \\times H}$, and $y = hW_\\text{down}^\\top$ with $y \\in \\mathbb{R}^{T \\times D}$. The second matmul reads every $h_{tk}$ once **per output column**, $D$ times in all. Fusing a producer into it replaces each of those reads by the producer's own computation:

| fusion tried | each $h_{tk}$ then costs | work ratio (fused / unfused) | verdict |
|---|---|---:|---|
| GELU's elementwise ops into the second matmul (a *prologue*) | GELU recomputed $D$ times | 1.5\u20132.4\xD7 | declined |
| the first matmul into the second | a length-$D$ dot product, recomputed $D$ times | 171\u2013256\xD7 | declined |
| GELU into the first matmul's *epilogue* | GELU once, as the output is written | < 1\xD7 | **accepted** |

The matmul-into-matmul ratio is easy to derive. With $c$ the cost of one multiply-add including its two loads,

$$W_\\text{fused} \\approx \\underbrace{T D H}_{\\text{reads of } h} \\cdot \\underbrace{D\\,c}_{\\text{one dot product}}, \\qquad W_\\text{unfused} \\approx 2 \\cdot TDH\\,c \\qquad\\Rightarrow\\qquad \\frac{W_\\text{fused}}{W_\\text{unfused}} \\approx \\frac{D}{2} = 256$$

Fusion is only free when the producer's value is used about once per element, or when recomputing it is cheaper than a round trip through memory.

## The guard

\`merge_loop_ops\` has a guard: fuse only if $\\text{work}(\\text{fused}) \\le \\text{work}(\\text{producer}) + \\text{work}(\\text{consumer})$. Work counts flops plus 12 units per memory access (\`W_MEM\`), so inlining a cheap elementwise producer that is read once still wins: it removes a store and a load. The [Trace](lab:view?name=trace) shows 13 declined steps with their numbers, e.g. *blowup: fused work 10,472,128,512 > unfused 7,001,866,240* (a piece of GELU into the second matmul) and *fused work 3,581,468,999,680 > unfused 13,976,469,504* (matmul into matmul).

The result is 2 kernels: \`k_linear_gelu_reduce\` (32.2 \xB5s) and \`k_linear_reduce\` (44.4 \xB5s) on the simulated RTX 5090.

The pass also runs **consumers first** (\`order("reverse")\`). Fusing in producer order could merge the wrong pair first and leave a worse partition.

## SwiGLU

$$\\operatorname{SwiGLU}(x) = \\big(\\operatorname{SiLU}(xW_g^\\top) \\odot xW_u^\\top\\big) W_d^\\top$$

Two matmuls read the same $x$; their elementwise product feeds the third. Count the kernels after the switch: which fusions does the guard accept now?

## Exercises

1. Change \`W_MEM\` in \`std/loop.js\` to 1. Which fusions does the guard accept now, and is the compiled program faster or slower?
2. Write the work estimate for fusing a row softmax into a following matmul over the same rows. Is that fusion profitable? (It is the heart of FlashAttention.)
3. Find the declined steps' node ids in Trace, then look those nodes up in the [loop IR](lab:ir?name=loop).
`},{id:"W-10",title:"Attention",group:"ML compiler",about:"softmax(QK\u1D40/\u221Ad)\xB7V for several heads: batched tiled matmuls around a fused scale-and-softmax",tries:["Add a causal mask with N.select and N.lt","Which kernel dominates, and what bounds it?"],text:`/** W-10 Attention
 *  group  ML compiler
 *  about  softmax(QK\u1D40/\u221Ad)\xB7V for several heads: batched tiled matmuls around a fused scale-and-softmax
 *  try    Add a causal mask with N.select and N.lt | Which kernel dominates, and what bounds it?
 */
// Scaled dot-product attention, batched over heads. The scale fuses into the softmax kernel; the two
// matmuls are batched contractions the tile pass maps like W-08 (with the head as a grid dimension).
const heads = param.int("heads", { min: 1, max: 32, default: 8 });
const seq = param.int("seq", { min: 16, max: 2048, default: 256, scale: "log" });
const dk = param.int("d_head", { min: 16, max: 128, default: 64, scale: "log" });

project("attention")
  .params(heads, seq, dk)
  .program(({ q, kk, v }, { param }) => {
    const s = N.mul(N.matmul(q, N.transpose(kk)), 1 / Math.sqrt(param(dk)));
    return { out: N.matmul(N.softmax(s, -1), v) };
  }, ({ param }) => { const t = k.tensor([param(heads), param(seq), param(dk)]); return { q: t, kk: t, v: t }; });
`,notes:`# Attention

Scaled dot-product attention, batched over heads:

$$\\operatorname{Attention}(Q, K, V) = \\operatorname{softmax}\\!\\Big(\\frac{QK^\\top}{\\sqrt{d}}\\Big)V$$

The compiler produces three kernels: $S = QK^\\top$ (tiled), the scale fused into the softmax (a row kernel), and $PV$ (tiled). Here is what that costs, and what FlashAttention changes.

| sequence $L$ | $QK^\\top$ | scale + softmax | $PV$ | total |
|---:|---:|---:|---:|---:|
| 256 | 6.2 \xB5s | 5.0 \xB5s | 9.5 \xB5s | 20.8 \xB5s |
| 1024 | 41.9 | 40.6 | 54.5 | 137 |
| 2048 | 168 | 153 | 218 | 539 |

Simulated RTX 5090, 8 heads, $d = 64$. From 256 to 2048 the sequence grows 8\xD7 and the time 26\xD7; with launch overheads amortized, it tends to the $64\\times$ of an $L^2$ algorithm. At $L = 2048$ the softmax kernel alone moves 256 MiB through DRAM: it reads the score matrix once and writes it once.

> **Try it** \u2014 [measure](lab:measure), then grow the [sequence to 1024](lab:param?name=seq&value=1024&measure) and [2048](lab:param?name=seq&value=2048&measure) and watch the DRAM column of the middle kernel. [Back to 256](lab:param?name=seq&value=256).

## The maths: quadratic memory

With $h$ heads, sequence length $L$ and head dimension $d$:

| | flops | bytes the score matrix moves |
|---|---|---|
| $S = QK^\\top$ | $2hL^2d$ | write $4hL^2$ |
| softmax | $\\approx 5hL^2$ | read and write $4hL^2$ each |
| $PV$ | $2hL^2d$ | read $4hL^2$ |

The score matrix $S \\in \\mathbb{R}^{h \\times L \\times L}$ goes through DRAM about four times. Its size grows with $L^2$, while $Q$, $K$, $V$ and the output only grow with $L$. At $h = 8$, $L = 2048$ that is 128 MiB of scores, for 3 \xD7 4 MiB of inputs. For long sequences attention is dominated by moving a matrix that nobody needs to keep.

## FlashAttention in one paragraph

Tile $Q$ by rows. For each tile, stream $K$ and $V$ tile by tile, computing a block of $S$ in shared memory. Update a running row max, a running softmax denominator and a running output with the online-softmax rescaling (W-06). Nothing of size $L^2$ ever reaches DRAM. The flops are the same; the bytes drop from $O(hL^2)$ to $O(hLd)$.

This compiler cannot do that yet. It needs a pair-valued reducer (running max and sum), and fusion *across* a contraction, which the blowup guard currently declines (see the declined steps in [Trace](lab:view?name=trace)). Both are good projects.

## Exercises

1. Add a causal mask as a fourth input, \`mask: k.tensor([seq, seq])\` (0 on and below the diagonal, $-10^9$ above), and add it to the scores before the softmax. Does it fuse into the softmax kernel? How many bytes does reading it cost at $L = 2048$, and how would computing the mask from the indices instead (\`row < col\`) avoid them?
2. At which sequence length does the score matrix exceed the RTX 5090's 96 MB of L2?
3. Compute the arithmetic intensity of the $QK^\\top$ kernel for $d = 64$. Why is attention with small heads harder to make compute-bound than a big linear layer?

## Further reading

- Vaswani et al., *Attention Is All You Need* (2017)
- Dao et al., [FlashAttention](https://arxiv.org/abs/2205.14135); Milakov & Gimelshein, *Online normalizer calculation for softmax*
`},{id:"W-11",title:"N-body forces",group:"Write programs",about:"an all-pairs physics kernel written with broadcasting: the compiler finds a reduction over particles",tries:["Is this compute-bound or memory-bound, and why?","Add a softening slider and a mass per particle"],text:`/** W-11 N-body forces
 *  group  Write programs
 *  about  an all-pairs physics kernel written with broadcasting: the compiler finds a reduction over particles
 *  try    Is this compute-bound or memory-bound, and why? | Add a softening slider and a mass per particle
 */
// For every particle i: a_i = \u03A3_j (p_j \u2212 p_i) / (|p_j \u2212 p_i|\xB2 + \u03B5)^{3/2}. Written as tensor code: the pair
// differences are a broadcast (n,1,3) \u2212 (1,n,3), the distance is a reduction over xyz, and the force sum
// is a reduction over j. The compiler never materializes the n\xD7n\xD73 tensor: it fuses into reductions.
const n = param.int("particles", { min: 64, max: 8192, default: 512, scale: "log" });
const soft = param.float("softening", { min: 0.001, max: 0.5, step: 0.001, default: 0.01 });

project("nbody")
  .params(n, soft)
  .program(({ p }, { param }) => {
    const N_ = param(n);
    const d = N.sub(N.reshape(p, [1, N_, 3]), N.reshape(p, [N_, 1, 3]));          // d[i, j] = p_j \u2212 p_i
    const r2 = N.add(N.sum(N.square(d), -1), param(soft));                       // (n, n, 1)
    const inv = N.pow(r2, -1.5);
    return { a: N.sum(N.mul(d, inv), 1, false) };                                // \u03A3_j \u2192 (n, 3)
  }, ({ param }) => ({ p: k.tensor([param(n), 3]) }))
  .check("forces sum to ~zero (Newton's third law)", ({ outputs }) => {
    const a = outputs.a.data; const s = [0, 0, 0];
    for (let i = 0; i < a.length; i++) s[i % 3] += a[i];
    const scale = a.reduce((m, x) => Math.max(m, Math.abs(x)), 0) * Math.sqrt(a.length);
    return s.every((x) => Math.abs(x) < 1e-3 * scale) || \`net force \${s.map((x) => x.toExponential(2)).join(", ")}\`;
  });
`,notes:`# N-body forces

Not every GPU kernel is a neural-network layer. This project computes the gravitational pull of every particle on every other particle \u2014 an $O(n^2)$ all-pairs interaction \u2014 written with plain broadcasting. The compiler finds the reductions, maps the pairwise distances to a tiled kernel, and refuses one tempting fusion.

> **Try it** \u2014 [measure](lab:measure) at 512 particles, then at [2048](lab:param?name=particles&value=2048&measure) and [8192](lab:param?name=particles&value=8192&measure). Watch which bound the kernels hit. [Back to 512](lab:param?name=particles&value=512).

## The maths

With unit masses and $G = 1$, particle $i$ accelerates towards every other particle $j$:

$$a_i = \\sum_j \\frac{p_j - p_i}{\\big(\\lVert p_j - p_i \\rVert^2 + \\varepsilon\\big)^{3/2}}$$

The **softening** $\\varepsilon$ keeps the force finite when two particles nearly coincide, and makes the $j = i$ term zero instead of $0/0$. Because the pair force is antisymmetric ($F_{ij} = -F_{ji}$), the total $\\sum_i a_i$ is zero up to rounding: Newton's third law, which the project's check tests.

The program builds the pairwise differences by broadcasting: \`reshape(p, [1, n, 3]) \u2212 reshape(p, [n, 1, 3])\` is an $n \\times n \\times 3$ tensor that is never stored. Views compose into index maps, so \`d[i, j, c]\` is just \`p[j, c] \u2212 p[i, c]\` inside a loop.

**Work.** About 20 flops per pair: $20n^2$ in all. Bytes: the positions, $12n$. The intensity grows linearly with $n$, so all-pairs kernels are classic compute-bound workloads, *if* the positions are reused from on-chip memory.

## What the compiler makes

Two kernels (simulated RTX 5090):

| particles | \`k_ew_reduce_reduce\`: $r^2_{ij}$ | \`k_ew_reduce_reduce_2\`: $a_i$ | total |
|---:|---|---|---:|
| 512 | 3.3 \xB5s, tiled, launch-bound | 5.1 \xB5s, row per (particle, coordinate) | 8.4 \xB5s |
| 2048 | 17.5 \xB5s, L2-bound | 41.0 \xB5s, L2-bound | 58.4 \xB5s |
| 8192 | 376 \xB5s, DRAM-bound | 1093 \xB5s, DRAM-bound | 1469 \xB5s |

1. **The squared distances** $r^2_{ij} = \\sum_c (p_{jc} - p_{ic})^2$ form an $n \\times n$ matrix with a reduction over 3 coordinates. The tile pass recognizes the shape of a contraction (output $(i, j)$, reduction over $c$) and offers shared-memory tiles.
2. **The accelerations** $a_{ic} = \\sum_j d_{ijc} \\cdot (r^2_{ij} + \\varepsilon)^{-3/2}$: a row reduction over $j$ for each output $(i, c)$.

**The declined fusion.** Inlining $r^2$ into the second kernel would avoid writing and re-reading the $n \\times n$ matrix. But the second kernel reads each $r^2_{ij}$ three times (once per coordinate $c$), so fusing would compute every distance and every \`pow\` three times. The guard declines: *fused work 48,777,216 > unfused 40,912,896* (see *Declined* in [Trace](lab:view?name=trace)). At $n = 8192$ that decision costs dearly: the $r^2$ matrix is 256 MiB and goes through DRAM twice, which is why both kernels end up DRAM-bound.

## How it should be done

The classic GPU n-body kernel (*GPU Gems 3*, chapter 31) tiles over $j$: each block loads a tile of positions into shared memory, and each thread accumulates the force on its own particle from all of them. Nothing of size $n^2$ is stored; each position is read from DRAM $n/\\text{tile}$ times; the kernel runs near peak FLOP/s. Here that would need a reduction whose output has 3 components per thread \u2014 a vector-valued reducer, the same extension as online softmax (W-06) and Welford (W-22).

> **Note** \u2014 the tile pass only offers \`MAP=tiled\` when every value the reduction loop reads is either a tile operand or computed inside the loop. A hoisted value like $p_i$ inside $\\sum_j (p_j - p_i)\\,w_{ij}$ would have no home in a tiled kernel. That legality rule was added after this very program broke the tiled materializer at 2048 particles.

## Exercises

1. Compute the arithmetic intensity of the ideal (tiled-over-$j$) kernel at $n = 8192$ and place it on the RTX 5090's roofline (W-18).
2. Rewrite the program so the second kernel reads $r^2$ once: compute the scalar weight $w_{ij} = (r^2_{ij} + \\varepsilon)^{-3/2}$ as its own output first. Does the fusion guard now accept a different partition?
3. The check accepts a net force below $10^{-3} \\cdot \\max_i |a_i| \\cdot \\sqrt{3n}$. Why scale the tolerance with the largest force, and why with $\\sqrt{n}$ rather than $n$? (Hint: rounding errors of a sum behave like a random walk.)

## Further reading

- Nyland, Harris, Prins, *Fast N-Body Simulation with CUDA*, GPU Gems 3, chapter 31
- Barnes & Hut (1986): the $O(n \\log n)$ tree algorithm that replaces all-pairs at large $n$
`},{id:"W-12",title:"Box blur, a stencil",group:"Write programs",about:"nine shifted slices summed: views compose into index maps, so the whole stencil is one kernel",tries:["Make the radius a slider","Why is sectors per request above 4 here?"],text:`/** W-12 Box blur, a stencil
 *  group  Write programs
 *  about  nine shifted slices summed: views compose into index maps, so the whole stencil is one kernel
 *  try    Make the radius a slider | Why is sectors per request above 4 here?
 */
// out[y, x] = mean of img[y + dy, x + dx] for dy, dx in 0..2r. Each shifted slice is a view (an index map,
// not a copy); the adds fuse; the kernel reads each input pixel from up to nine threads (L2 hits).
const H = param.int("height", { min: 32, max: 4096, default: 1024, scale: "log" });
const W = param.int("width", { min: 32, max: 4096, default: 1024, scale: "log" });
const r = param.int("radius", { min: 1, max: 3, default: 1 });

project("blur")
  .params(H, W, r)
  .program(({ img }, { param }) => {
    const h = param(H), w = param(W), k2 = 2 * param(r) + 1;
    let acc = null;
    for (let dy = 0; dy < k2; dy++) for (let dx = 0; dx < k2; dx++) {
      const s = N.slice(N.slice(img, 0, dy, dy + h), 1, dx, dx + w);
      acc = acc ? N.add(acc, s) : s;
    }
    return { out: N.mul(acc, 1 / (k2 * k2)) };
  }, ({ param }) => ({ img: k.tensor([param(H) + 2 * param(r), param(W) + 2 * param(r)]) }));
`,notes:`# Box blur, a stencil

A stencil \u2014 each output pixel averages its neighbourhood \u2014 written as a sum of shifted slices of the input. The slices are **views**: index maps, not copies. They compose and fuse, so the whole stencil is one kernel that never materializes a shifted image.

> **Try it** \u2014 [measure](lab:measure), then grow the [radius to 2](lab:param?name=radius&value=2&measure) and [3](lab:param?name=radius&value=3&measure). [Back to 1](lab:param?name=radius&value=1).

## The maths

$$\\text{out}_{yx} = \\frac{1}{(2r+1)^2} \\sum_{dy=0}^{2r} \\sum_{dx=0}^{2r} \\text{img}_{y+dy,\\,x+dx}$$

The input is padded by $r$ on each side, so \`slice(slice(img, 0, dy, dy+H), 1, dx, dx+W)\` is the window shifted by $(dy, dx)$. In the Tensor IR each slice is a \`view\` with the index map $(y, x) \\mapsto (y + dy, x + dx)$. The optimizer folds view-of-view into one map, and fusion inlines all $(2r+1)^2$ of them into one loop body. Read the [loop IR](lab:ir?name=loop): nine loads of \`in0\` at different offsets, eight adds, one multiply.

## The system: L2 does the reuse

Each input pixel is read by $(2r+1)^2$ different threads. Nothing in the kernel shares those reads explicitly, but neighbouring threads run at nearly the same time, so the repeats hit the L2 cache. The kernel is **L2-bound**, not DRAM-bound:

| radius | taps | L2 traffic | time (simulated RTX 5090, 1024 \xD7 1024) |
|---:|---:|---:|---:|
| 1 | 9 | 48 MiB | 12.1 \xB5s |
| 2 | 25 | 124 MiB | 27.5 \xB5s |
| 3 | 49 | 242 MiB | 51.1 \xB5s |

The time grows with the number of taps, while DRAM traffic stays near the 8 MiB minimum (read the image once, write the result once). Two details are visible in [Perf](lab:view?name=perf):

- **Sectors per request \u2248 4.9, not 4.** A warp's 32 consecutive loads start at offset $dx$, so 128 bytes straddle 5 of the 32-byte sectors whenever $dx \\bmod 8 \\ne 0$. Misaligned access wastes about 20% of each transfer.
- **Intensity \u2248 1 flop/byte** against L2: no schedule choice can make this kernel compute-bound.

## How it should be done

Production stencils stage a tile plus its **halo** (the $r$-wide border) in shared memory: each block loads $(B + 2r)^2$ pixels once and computes $B^2$ outputs from shared memory. A separable blur goes further: a box filter is a horizontal pass followed by a vertical pass, $2(2r+1)$ taps instead of $(2r+1)^2$. Both are transformations this compiler doesn't do: the first needs a 2-D staging schedule, the second an algebraic rewrite of the program.

## Exercises

1. Write the separable version as two programs-in-one: a horizontal blur into a temporary, then a vertical blur. Does the compiler fuse them back into one kernel? Should it?
2. For radius 3, how many bytes would a halo-tiled kernel with 32 \xD7 32 output tiles read from L2 per output pixel?
3. Change the padding so the slices start at multiples of 8 floats. Does *sectors per request* drop to 4?

`,notes:`# LayerNorm with a residual

Every transformer block ends with $y = \\operatorname{LayerNorm}(x + r)$: the sub-layer's output added to the residual stream, then normalized. Unfused, the sum $x + r$ is written to memory and read back. Fused, it lives in registers and shared memory for the duration of one row.

> **Try it** \u2014 [measure](lab:measure) and look at the DRAM column in [Perf](lab:view?name=perf), then read the single kernel in [Kernels](lab:view?name=kernels).

## The maths

$$u = x + r, \\qquad \\mu = \\frac1D \\sum_j u_j, \\qquad \\sigma^2 = \\frac1D \\sum_j (u_j - \\mu)^2, \\qquad y_j = \\frac{u_j - \\mu}{\\sqrt{\\sigma^2 + \\varepsilon}}\\, g_j + b_j$$

Two reductions per row (the mean, then the variance around it \u2014 the stable two-pass form from W-22), then an elementwise affine transform.

**Bytes.** For 2048 rows of 1024 floats: read $x$ and $r$ (8 MiB each), write $y$ (8 MiB) = **24 MiB**. Unfused, $u$ would add a write and a read: 40 MiB. At 1792 GB/s that is the difference between 14 \xB5s and 23 \xB5s of pure traffic.

## What you should see

One kernel, \`k_ew_layer_norm_reduce\`, 17.7 \xB5s on the simulated RTX 5090, 24 MiB of DRAM traffic: the minimum. The schedule is one block of 1024 threads per row, with the row of $u$ staged in shared memory (\`STAGE=all\`). The three sweeps (mean, variance, normalize) read $u$ from shared memory, not DRAM.

The checks verify both the structure ("one kernel") and the maths: every output row has mean \u2248 0 and variance \u2248 1 (with $g = 1$, $b = 0$).

## The system

- The residual add is an elementwise producer read by three sweeps of the row. Inlining it means computing $x_j + r_j$ three times, which the fusion guard accepts: three adds are cheaper than a store and a load (W-09 explains the work estimate).
- With \`STAGE=all\`, the kernel computes $u$ once while staging it, so even the recomputation disappears.

## Exercises

1. Return $x + r$ as a second output (transformers need the updated residual stream). What happens to the kernel count and the bytes? Is the result still optimal?
2. Compare with RMSNorm (W-05) on the [A100](lab:device?id=sim:a100&measure): does the extra reduction cost time on a memory-bound kernel?
3. Why does the model pick 1024 threads per row here but 128 for the softmax in W-06? (Hint: rows, SMs and waves.)

`,notes:`# Your own pass in the ML pipeline

A compiler pass you write, inserted into the standard ML pipeline. Softmax ends with $e_j / \\sum_k e_k$: a division per element by a value that is the same for the whole row. Division costs several multiplies, so the pass rewrites it to $e_j \\cdot (1/\\sum_k e_k)$, and code motion computes the reciprocal once per row.

> **Try it** \u2014 the pass is a fork with the knob **RECIP**, listed under *knobs* in the Code view's Parameters panel (also in [Knobs](lab:view?name=knobs)). Pin it [off](lab:pin?RECIP=false) and [on](lab:pin?RECIP=true), and diff the [loop IR](lab:ir?name=loop) and the [CUDA](lab:view?name=kernels). [Unpin](lab:unpin?name=RECIP).

## The rule

\`\`\`js
const hoistRecip = k.rule("hoist_reciprocal")
  .match(P.op("tensor.ew").as("n").where(({ n }) =>
    n.attrs.fn === "div" && n.arg(1).is(Tn.view) && numel(n.arg(1).arg(0).shape) < numel(n.shape)))
  .rewrite(({ n }) => k.fork.toggle(RECIP, () => { \u2026 T.ew("mul", n.arg(0), view(recip(\u03A3e))) \u2026 }));
\`\`\`

- **The pattern** matches a division whose divisor is a *broadcast*: a \`view\` of a smaller tensor. Only then is there something to hoist.
- **The rewrite** builds \`recip\` at the small shape and broadcasts the result. Because the reciprocal sits *before* the broadcast, loop-invariant code motion places it at the row level of the loop nest: once per row, not once per element.
- **\`k.fork.toggle(RECIP, \u2026)\`** makes it a choice, not a forced rewrite: the original and the rewritten graph are both options, and a decide policy picks.

## The pass and its place

\`\`\`js
const recipPass = k.pass("frontend/reciprocal").short("r").rules(hoistRecip).knobs(RECIP)
  .check((g) => \u2026no div left with RECIP on\u2026 || "a div survived the rewrite");
const base = std.emmy.pipeline().insertAfter("frontend/optimization", recipPass);
const flops = k.decide.cost(({ knobs }) => (knobs.RECIP ? 1 : 4), { name: "flops" }).for("hoist_reciprocal");
\`\`\`

- **\`.check\`** is a pass postcondition, run after the pass on every compile. Pass checks catch bugs where they happen instead of three IRs later.
- **\`insertAfter\`** puts the pass after the tensor-level optimizations, so it sees the decomposed softmax.
- **The policy** scores the fork by flops (a multiply 1, a division 4) and goes in front of the standard chain. In [Knobs](lab:view?name=knobs) the decision reads *by flops*.

## Does it matter?

The softmax at 1024 \xD7 1024 runs in 7.9 \xB5s either way on the simulated RTX 5090: it is memory-bound (W-06), and the arithmetic hides under the DRAM traffic. On a real GPU, \`div.rn.f32\` is a multi-instruction sequence while \`rcp\` + \`mul\` is two, so the rewrite matters for compute-bound kernels. A fast-math compiler flag does the same globally, with less control. This is how to think about any rewrite: **it saves what the kernel is bound by, or it saves nothing.**

## Exercises

1. Extend the pattern to division by a scalar constant ($x / 3 \\to x \\cdot 0.\\overline{3}$). Is that rewrite exact in fp32? (Hint: 3 is not a power of two.)
2. Make RECIP's cost depend on the device: a policy that returns \`null\` (no opinion) on WebGPU.
3. Write a pass check that fails if any \`recip\` sits inside a per-element loop in the Loop IR.
`},{id:"W-15",title:"Your own cost model",group:"Extend the compiler",about:"replace the schedule cost model with your own (occupancy first): it maps a matmul one row per block and runs 18\xD7 slower",tries:["Tune, then compare the measured best with what this model picked","Write a model that prefers fewer blocks"],text:`/** W-15 Your own cost model

// Every schedule fork is ranked by a decide policy. The default chain is: pins \u2192 measured evidence \u2192
// std.tile.costPrior (an analytic roofline + occupancy model) \u2192 first. Here the model is replaced by one
// that only cares about occupancy, ties broken by threads per block. Knobs shows each option's score
// under "occupancy"; the model column is the standard model, for comparison. It is often wrong:
// occupancy is not speed. Measure and Tune to see by how much.
const { analyze, estimate } = std.tile;
const occupancyFirst = k.decide.cost(({ knobs, node, ctx }) => {
  if (!node.is("loop.kernel")) return null;
  const an = analyze(node.attrs.expr, node.attrs.shape, node.args.map((a) => a.shape));
  const e = estimate(an, knobs, ctx.target);
  if (!isFinite(e.us)) return Infinity;                      // illegal on this device
  return -e.occupancy + (knobs.TPB || knobs.BM * knobs.BN / ((knobs.TM || 1) * (knobs.TN || 1)) || 0) * 1e-6;

const pipe = std.emmy.pipeline().with({ decide: k.decide.chain(k.decide.pinned(), k.decide.evidence(), occupancyFirst, k.decide.first()) });

const rows = param.int("rows", { min: 16, max: 8192, default: 2048, scale: "log" });
const dim = param.int("dim", { min: 64, max: 8192, default: 1024, scale: "log" });
project("occupancy")
  .pipeline(pipe)
  .params(rows, dim)
  .program(({ x }, { param }) => {
    const d = param(dim);
    return { y: N.rms_norm(N.gelu(N.linear(x, std.weight("W", [d, d]))), std.weight("w", [d])) };
  }, ({ param }) => ({ x: k.tensor([param(rows), param(dim)]) }))
  // an info check: what the standard model thinks of each pick this policy made
  .check("occupancy-first vs the standard model", ({ run }) => {
    const g = run.at("loop"), out = [];
    for (const d of run.decisions) {
      const node = d.node && g.node(d.node) && g.value(d.node);
      if (!node || !node.is("loop.kernel")) continue;
      const an = analyze(node.attrs.expr, node.attrs.shape, node.args.map((a) => a.shape));
      const est = d.options.map((o) => estimate(an, o.knobs, run.ctx.target).us);
      const mine = est[d.options.findIndex((o) => o.label === d.label)], best = Math.min(...est);

    }

`,notes:`# Your own cost model

The compiler chooses each kernel's schedule with a **decide policy**. This project swaps the standard analytic model for a tempting heuristic: *maximize occupancy*. On a matmul it picks one row per block with 64 threads, and runs 18\xD7 slower. A cost model must model the bottleneck, not a proxy for it.

> **Try it** \u2014 [measure](lab:measure) and read the info check in the [Code view](lab:view?name=code). Then pin the standard model's choice for the matmul, [\`MAP=tiled\` 128\xD7128](lab:pin?MAP=tiled&BM=128&BN=128&BK=8&TM=8&TN=2&measure), and [unpin](lab:unpin).

## The policy

\`\`\`js
const occupancyFirst = k.decide.cost(({ knobs, node, ctx }) => {
  const e = estimate(analyze(\u2026node\u2026), knobs, ctx.target);
  if (!isFinite(e.us)) return Infinity;           // illegal on this device
  return -e.occupancy + threadsPerBlock(knobs) * 1e-6;   // most warps per SM, then smaller blocks
}, { name: "occupancy" }).for("schedule");
const pipe = std.emmy.pipeline().with({ decide: k.decide.chain(k.decide.pinned(), k.decide.evidence(), occupancyFirst, k.decide.first()) });
\`\`\`

A cost function returns a number per option (lower is better), \`Infinity\` for illegal, or \`null\` for "no opinion" \u2014 then the next policy in the chain decides.

## What happens

The program is $y = \\operatorname{RMSNorm}(\\operatorname{GELU}(xW^\\top))$ with $x \\in \\mathbb{R}^{2048 \\times 1024}$. Two kernels, simulated RTX 5090:

| kernel | occupancy-first picks | time | the standard model picks | time |
|---|---|---:|---|---:|
| matmul | \`MAP=row, TPB=64\` \u2014 occupancy 1.00 | **3212 \xB5s**, 1.3 TFLOP/s | tiled 128\xD7128, 8\xD72 per thread \u2014 occupancy 0.67 | 181 \xB5s, 23.7 TFLOP/s |
| GELU + RMSNorm | \`MAP=row, TPB=64\` | 12.6 \xB5s | \`MAP=row, TPB=1024, STAGE=all\` | 12.6 \xB5s |

**Why the row map loses by 18\xD7.** One block per output row computes 1024 dot products of length 1024, reading $W$ straight from L2 for every row: $2048 \\times 4\\ \\text{MiB} = 8\\ \\text{GiB}$ of L2 traffic. The tiled map reads each element of $W$ once per 128-row tile from L2 and then serves it from shared memory and registers (W-21). Occupancy is 100% in the first case and 67% in the second \u2014 and it doesn't matter, because neither kernel is waiting for DRAM latency. One is bound by L2 bandwidth, the other by shared-memory bandwidth.

**Why the norm kernel ties.** Memory-bound row kernels need enough warps to keep bytes in flight (W-23); here both choices have enough, so occupancy-first happens to agree with the model.

## The maths: what a cost model must predict

The standard model, \`std.tile.estimate\`, counts per option: flops, DRAM bytes, L2 bytes, shared-memory wavefronts (with exact bank conflicts for tiled kernels) and warp instructions. It turns each count into time at that unit's peak rate, takes the maximum (the bottleneck), and derates by achieved occupancy and wave quantization:

$$t = \\sum_\\text{waves} \\max_{u \\in \\{\\text{dram, l2, smem, issue}\\}} \\frac{\\text{count}_u \\cdot \\text{share}}{\\text{rate}_u \\cdot \\text{eff}_u(\\text{occupancy})} + t_\\text{launch}$$

Occupancy appears only as an efficiency factor. A model that optimizes the factor and ignores the counts optimizes the wrong thing.

## Exercises

1. Write a cost model that ranks by *estimated L2 bytes* only. Which kernels does it get right, and which wrong?
2. Make occupancy-first return \`null\` for any kernel with a contraction (\`an.contraction\`), so the chain falls through to \`k.decide.first()\`. What does \`first\` pick? Now add \`std.tile.costPrior\` to the chain instead.
3. [Tune for 16 programs](lab:tune?strategy=sweep&budget=16). The evidence policy is in the chain in front of your model: does the measured evidence overrule it? (It only does once your model's own favourite has been measured.)

## Further reading

- Williams, Waterman, Patterson, *Roofline* (2009)
- Chen et al., *TVM* (OSDI 2018) and *Learning to Optimize Tensor Programs* (2018): analytic vs learned cost models

  .op("hard_swish", { args: ["x"], traits: ["pure"], infer: ({ x }) => x.type, print: "hard_swish({x})",

  .withIr("torch", { dialects: [...std.emmy.pipeline().steps[0].opts.dialects, Ext] });

const tokens = param.int("tokens", { min: 16, max: 8192, default: 1024, scale: "log" });
const dim = param.int("dim", { min: 64, max: 8192, default: 1024, scale: "log" });

  .check("hard_swish fused into the matmul's epilogue", ({ run }) => run.graph.findAll("gpu.kernel").length === 1 || \`\${run.graph.findAll("gpu.kernel").length} kernels\`);
`,notes:`# A new frontend op

Adding an operator to a compiler takes three things: its **meaning** (a reference implementation every lower level is checked against), its **type rule**, and a **lowering** into ops the compiler already handles. This project adds \`hard_swish\` from MobileNetV3. After decomposition it is ordinary Tensor IR and fuses into a matmul's epilogue like a built-in.

> **Try it** \u2014 compile and look for \`ext.hard_swish\` in the [torch IR](lab:ir?name=torch), and for its pieces in the [tensor IR](lab:ir?name=tensor). [Measure](lab:measure): one kernel.

## The maths

$$\\operatorname{hard\\_swish}(x) = x \\cdot \\frac{\\min(\\max(x + 3, 0), 6)}{6}$$

A piecewise-linear approximation of $\\operatorname{swish}(x) = x \\cdot \\sigma(x)$: zero for $x \\le -3$, the identity for $x \\ge 3$, and a parabola in between. It needs no exponential, which is why it was designed for mobile CPUs.

## The three pieces

\`\`\`js
const Ext = k.dialect("ext")
  .op("hard_swish", { args: ["x"], traits: ["pure"], infer: ({ x }) => x.type, print: "hard_swish({x})",
    eval: ({ x }) => { \u2026x\xB7min(max(x+3,0),6)/6 per element\u2026 } });                       // meaning + type
const lowerHardSwish = std.decompose("ext.hard_swish",
  ({ x }) => T.mul(x, T.div(T.ew("min", T.ew("max", T.add(x, 3), 0), 6), 6)));        // lowering
const pipe = std.emmy.pipeline().insertRule("frontend/decomposition", lowerHardSwish)
  .withIr("torch", { dialects: [...std.emmy.pipeline().steps[0].opts.dialects, Ext] });
\`\`\`

- **\`eval\`** is the semantics. The end-to-end check runs the program through it, and compares with the Loop IR's evaluation. If the decomposition were wrong (say, \`/ 3\` for \`/ 6\`), the check would fail.
- **\`insertRule\`** adds the decomposition to the standard pass rather than writing a new pass.
- **\`withIr("torch", \u2026)\`** registers the dialect at the first checkpoint. Checkpoints are **strict**: if an op isn't allowed at a level, compilation stops with an error naming the op and the rule that declined to lower it.

## What you should see

One kernel, \`k_linear_ext_hard_swish_reduce\`: a 1024 \xD7 1024 \xD7 1024 tiled matmul (128\xD764 tiles, 4\xD72 per thread) with hard_swish in its epilogue, 119.8 \xB5s on the simulated RTX 5090. That's the same time as the plain linear layer of W-08: the activation costs nothing. It is applied to each output once, in registers, before the single store.

Put the activation *before* the linear layer instead, and the fusion guard keeps it as a separate kernel: inlined into the matmul's operand loads, it would be recomputed once per output column (W-09).

## Exercises

1. Remove the \`insertRule\` line. What does the strict tensor checkpoint report?
2. Add \`hard_sigmoid(x) = min(max(x + 3, 0), 6) / 6\` the same way, then rewrite hard_swish in terms of it. Does the fused kernel change?
3. Add a deliberate bug to the decomposition (\`T.add(x, 2)\`). Which check catches it, and with what error?

// IRs:  regex (the parsed pattern: char, any, cat, alt, star, plus, opt)
//   \u2500desugar\u2192 core (plus and opt rewritten away)  \u2500thompson\u2192 nfa  \u2500subset, minimize\u2192 dfa  \u2500codegen\u2192 js
// Every level evaluates, so the end-to-end check runs the source matcher and the generated code on the
// same strings. The pattern is a text parameter: edit it in the Code view's parameters.
const RX = { kind: "regex" };
const pattern = param.text("pattern", { default: "(ab|a)*b+.c?", help: "literals, ., |, *, +, ?, ( )" });
const MIN = param.bool("minimize", { default: true, help: "merge equivalent DFA states (Moore's algorithm)" });

// ---- the source dialect: each node evaluates to a matcher (s, i) \u2192 set of end positions
const ends = (f) => f;
const Re = k.dialect("re")
  .op("char", { attrs: { c: "a" }, infer: () => RX, print: "'{c}'", eval: ({ c }) => (s, i) => (s[i] === c ? [i + 1] : []) })
  .op("any", { infer: () => RX, print: ".", eval: () => (s, i) => (i < s.length ? [i + 1] : []) })
  .op("eps", { infer: () => RX, print: "\u03B5", eval: () => (s, i) => [i] })
  .op("cat", { args: ["a", "b"], infer: () => RX, print: "{a}\xB7{b}", eval: ({ a, b }) => (s, i) => [...new Set(a(s, i).flatMap((j) => b(s, j)))] })
  .op("alt", { args: ["a", "b"], infer: () => RX, print: "{a} | {b}", eval: ({ a, b }) => (s, i) => [...new Set([...a(s, i), ...b(s, i)])] })
  .op("star", { args: ["a"], infer: () => RX, print: "{a}*", eval: ({ a }) => (s, i) => { const seen = new Set([i]), q = [i]; while (q.length) for (const j of a(s, q.pop())) if (!seen.has(j)) { seen.add(j); q.push(j); } return [...seen]; } })

  .op("opt", { args: ["a"], infer: () => RX, print: "{a}?", eval: ({ a }) => (s, i) => [...new Set([i, ...a(s, i)])] })
  .op("match", { args: ["rx", "s"], infer: () => k.scalar("bool"), print: "match({rx}, {s})", eval: ({ rx, s }) => (rx(s, 0).includes(s.length) ? 1 : 0) });

// a recursive-descent parser that builds the graph (runs while tracing)
function parse(src) {
  let i = 0;
  const peek = () => src[i], eat = (c) => { if (src[i] !== c) throw new Error(\`expected '\${c}' at \${i} in /\${src}/\`); i++; };

  k.rule("plus").match(P.op("re.plus").as("n")).rewrite(({ n }) => Re.cat(n.arg(0), Re.star(n.arg(0)))),

// ---- automata dialects
const OTHER = "\\u0000";
const nfaRun = ({ s, nfa }) => {
  const close = (set) => { const q = [...set]; while (q.length) for (const t of nfa.eps[q.pop()] || []) if (!set.has(t)) { set.add(t); q.push(t); } return set; };

const dfaRun = ({ s, dfa }) => { let st = 0; for (const ch0 of s) { const ch = dfa.alphabet.includes(ch0) ? ch0 : OTHER; st = dfa.table[st]?.[ch]; if (st == null) return 0; } return dfa.accept.includes(st) ? 1 : 0; };
const Auto = k.dialect("auto")

    print: ({ nfa }) => \`nfa(s) \xB7 \${nfa.n} states, \${nfa.edges.flat().length} edges, \${nfa.eps.flat().length} \u03B5-edges\`,
    body: ({ nfa }) => nfa.edges.map((es, q) => \`\${q === nfa.start ? "\u2192" : " "}\${q === nfa.accept ? "((" + q + "))" : " " + q + " "}  \${[...es.map(([c, t]) => \`\${c === OTHER ? "other" : c}\u2192\${t}\`), ...(nfa.eps[q] || []).map((t) => \`\u03B5\u2192\${t}\`)].join("  ")}\`).join("\\n") })

const Js = k.dialect("js")
  .op("fn", { args: ["s"], attrs: { source: "" }, infer: () => k.scalar("bool"), print: "js(s) \xB7 generated matcher", body: ({ source }) => source,

// ---- Thompson's construction: a whole-graph pass from the AST under match() to an NFA
const thompson = k.pass("thompson").short("t").whole(({ graph, edit }) => {

`,notes:"# Regex \u2192 NFA \u2192 DFA \u2192 JavaScript\n\nCompilers are not only about tensors. This project uses the same framework \u2014 dialects, rewrite rules, whole-graph passes, IR checkpoints, an end-to-end check \u2014 for a classic: compiling a regular expression into a deterministic automaton and then into JavaScript.\n\n> **Try it** \u2014 edit the **pattern** in the Code view's Parameters panel, or try [`(a|b)*abb`](lab:param?name=pattern&value=%28a%7Cb%29*abb), the textbook example. Toggle [minimize off](lab:param?name=minimize&value=false) and [on](lab:param?name=minimize&value=true), and compare the [DFA](lab:ir?name=dfa). Read the generated matcher in the [js IR](lab:ir?name=js).\n\n## The pipeline\n\n| IR | what it holds | pass to the next level |\n|---|---|---|\n| **regex** | the parsed pattern: `char`, `any`, `cat`, `alt`, `star`, `plus`, `opt` | `desugar`: $a^+ \\to a\\,a^*$, $a? \\to a \\mid \\varepsilon$ (rewrite rules) |\n| **core** | only `char`, `any`, `eps`, `cat`, `alt`, `star` | `thompson`: a whole-graph pass building an NFA |\n| **nfa** | one node holding states, edges and \u03B5-edges | `subset`, then `minimize` |\n| **dfa** | one node holding a transition table | `codegen` |\n| **js** | the source of a `switch`-based matcher | \u2014 |\n\nEvery level evaluates. The end-to-end check runs the source matcher and the generated function on 15 test strings, and a second check compares with JavaScript's own `RegExp`.\n\n## The maths\n\n**Thompson's construction** builds an NFA with \u03B5-moves, compositionally: each operator becomes a small gadget wired to its operands' gadgets. Each operator adds at most two states, so the NFA has $O(m)$ states for a pattern of length $m$. The default pattern `(ab|a)*b+.c?` gives 24 states.\n\n**Subset construction** makes it deterministic: each DFA state is the set of NFA states the input could have reached, closed under \u03B5-moves. In the worst case that is $2^{O(m)}$ states \u2014 `(a|b)*a(a|b)^{k}` needs $2^{k+1}$ \u2014 but typical patterns stay small.\n\n**Minimization (Moore's algorithm)** merges equivalent states. Start with two classes, accepting and not; repeatedly split a class whenever two of its states go, on some symbol, to different classes; stop when nothing splits. The result is the unique smallest DFA for the language.\n\n| pattern | NFA states | DFA states | minimized |\n|---|---:|---:|---:|\n| `(ab\\|a)*b+.c?` | 24 | 10 | 8 |\n| `(a\\|b)*abb` | 14 | 5 | 4 |\n\nFor `(a|b)*abb` the minimized DFA is the one in the Dragon Book (states 0\u20133, accepting 3), and the generated code is a four-case `switch`.\n\n## The system\n\n- **Whole-graph passes** (`k.pass(\u2026).whole(({ graph, edit }) => \u2026)`) replace a subgraph in one step. Rewrite rules suit local patterns; algorithms like subset construction need the whole automaton.\n- **Strict checkpoints** guarantee each level only contains its own dialect's ops: after `thompson` no `re.*` op may survive.\n- **The pattern is a text parameter** and `minimize` a pipeline parameter. Changing either recompiles, and the checks run again.\n\n## Exercises\n\n1. Add character classes `[a-c]`: parse them as an alternation, or (better) add an edge label for a set and teach `subset` to split the alphabet into disjoint classes.\n2. Write a pattern whose DFA has many more states than its NFA. How many does `(a|b)*a(a|b)(a|b)(a|b)` have?\n3. Make the code generator emit a lookup table (`Uint8Array`) instead of a `switch`. Which is faster for long strings?\n\n## Further reading\n\n- Russ Cox, [*Regular Expression Matching Can Be Simple And Fast*](https://swtch.com/~rsc/regexp/regexp1.html)\n- Aho, Lam, Sethi, Ullman, *Compilers: Principles, Techniques, and Tools*, chapter 3\n"},{id:"W-18",title:"The roofline: three regimes",group:"GPU optimization",about:"one elementwise kernel and two sliders: work per element moves it from memory-bound to compute-bound; size moves it to launch-bound",tries:["At what degree does  *  group  GPU optimization
 *  about  one elementwise kernel and two sliders: work per element moves it from memory-bound to compute-bound; size moves it to launch-bound
 *  try    At what degree does this kernel become compute-bound on the A100, and why is that lower than on the RTX 5090? | Explain the time at 4096 elements

// y = p(x), a polynomial of degree d evaluated per element in Horner form:
//   y = ((\u2026((c_d\xB7x + c_{d\u22121})\xB7x + c_{d\u22122})\xB7x \u2026)\xB7x + c_0
// Each degree costs one multiply and one add (2 flops); every element costs 8 bytes of DRAM traffic
// (read x, write y) whatever the degree. So the arithmetic intensity is d/4 flop per byte: the degree
// slider walks the kernel along the roofline's x axis. See the Notes.
const n = param.int("elements", { min: 1024, max: 16777216, default: 4194304, scale: "log", help: "tensor size" });
const degree = param.int("degree", { min: 1, max: 256, default: 8, scale: "log", help: "polynomial degree: 2\xB7degree flops per element" });

project("roofline")
  .params(n, degree)
  .program(({ x }, { param }) => {
    const d = param(degree);
    const c = (i) => 1 / (i + 1);                     // coefficients stay small: p(x) is bounded on [\u22121, 1)
    let y = N.add(N.mul(x, c(d)), c(d - 1));
    for (let i = d - 2; i >= 0; i--) y = N.add(N.mul(y, x), c(i));
    return { y };
  }, ({ param }) => ({ x: k.tensor([param(n)]) }))
  .check("one kernel, 2\xB7degree flops per element", ({ run }) => {
    const ks = run.graph.findAll("gpu.kernel");
    return ks.length === 1 || \`\${ks.length} kernels\`;
  });
`,notes:`# The roofline: three regimes

Every kernel is limited by one of three things: **arithmetic** (compute-bound), **moving bytes** (memory-bound), or **fixed overhead** (launch-bound). This project is one elementwise kernel with two sliders. Moving them carries the kernel through all three regimes, and the roofline model predicts where it ends up.

> **Try it** \u2014 [measure now](lab:measure), then [degree 256](lab:param?name=degree&value=256&measure) for compute-bound and [4096 elements](lab:param?name=elements&value=4096&measure) for launch-bound. [Reset](lab:param?name=elements&value=4194304) before the next section.

## The program

For every element $x_i$ the kernel evaluates a polynomial of degree $d$ in Horner form:

$$y_i = \\Big(\\big((c_d\\,x_i + c_{d-1})\\,x_i + c_{d-2}\\big)\\,x_i + \\dots\\Big)\\,x_i + c_0$$

Each Horner step is one multiply and one add, which the \`frontend/optimization\` pass contracts into one **fused multiply-add** (\`fma\`, the \`contract_fma\` rule \u2014 see it in [Trace](lab:view?name=trace)). An FMA counts as 2 floating-point operations but issues as 1 instruction. So per element:

| quantity | per element | for $n$ elements |
|---|---|---|
| work $W$ | $2d$ flop | $2dn$ |
| DRAM traffic $Q$ | 4 B read + 4 B write | $8n$ bytes |
| arithmetic intensity $I = W/Q$ | | $d/4$ flop/byte |

The degree changes the work but not the bytes. **Intensity is the x-axis of the roofline**, and the degree slider walks along it.

## The maths: the roofline

A GPU has a peak arithmetic rate $\\pi$ (flop/s) and a peak memory bandwidth $\\beta$ (bytes/s). A kernel with intensity $I$ cannot go faster than either:

$$P(I) \\;=\\; \\min\\big(\\pi,\\; \\beta \\cdot I\\big)$$

The two lines meet at the **ridge point** $I^* = \\pi/\\beta$. Below it, more arithmetic per byte is free: the memory system is the bottleneck. Above it, every extra flop costs time.

Turned around, the best possible time of a kernel is

$$t \\;\\ge\\; t_\\text{launch} + \\max\\!\\left(\\frac{Q}{\\beta},\\; \\frac{W}{\\pi}\\right)$$

and the term that wins names the regime. For this kernel the crossover degree is $d^* = 4 I^*$:

| GPU (simulated, FP32) | $\\pi$ | $\\beta$ | ridge $I^*$ | crossover degree $d^*$ |
|---|---:|---:|---:|---:|
| RTX 5090 | 104.8 TFLOP/s | 1792 GB/s | 58.5 | 234 |
| RTX 4090 | 82.6 | 1008 | 81.9 | 328 |
| H100 SXM | 67 | 3350 | 20.0 | 80 |
| A100 80GB | 19.5 | 2039 | 9.6 | 38 |
| Orin Nano class | 1.28 | 68 | 18.8 | 75 |

FP32 throughput counts the CUDA cores only. Tensor cores, which this compiler does not use, move $\\pi$ up by 10\xD7 or more on the datacenter parts. That is why "memory-bound" is the normal state of affairs for everything except big matmuls.

### Worked example: 4,194,304 elements on the RTX 5090

- $Q = 8 \\times 4{,}194{,}304 = 33.6$ MB, so $Q/\\beta = 33.6\\text{ MB} / 1792\\text{ GB/s} = 18.7\\ \\mu s$.
- At $d = 8$: $W = 67$ Mflop, $W/\\pi = 0.64\\ \\mu s$. Memory wins by 30\xD7.
- At $d = 256$: $W = 2.15$ Gflop, $W/\\pi = 20.5\\ \\mu s$. Now compute wins, narrowly.
- Add the launch overhead the simulator assumes, $t_\\text{launch} = 2.5\\ \\mu s$: the bound is about $21.2\\ \\mu s$ at low degree and $23\\ \\mu s$ at $d = 256$.

## What you should see

Simulated, 4,194,304 elements:

| degree | intensity | RTX 5090 | A100 | H100 |
|---:|---:|---|---|---|
| 1 | 0.25 | 21.4 \xB5s, dram | 19.0 \xB5s, dram | 12.5 \xB5s, dram |
| 8 | 2 | 21.4 \xB5s, dram | 19.0 \xB5s, dram | 12.5 \xB5s, dram |
| 32 | 8 | 21.4 \xB5s, dram | 19.0 \xB5s, dram | 12.5 \xB5s, dram |
| 64 | 16 | 21.7 \xB5s, dram | **30.1 \xB5s, compute** | 12.6 \xB5s, dram |
| 128 | 32 | 21.4 \xB5s, dram | 57.6 \xB5s, compute | **19.1 \xB5s, issue** |
| 256 | 64 | **23.2 \xB5s, issue** | 113.2 \xB5s, compute | 35.3 \xB5s, issue |

From degree 1 to 32 the time does not move at all: 32\xD7 more arithmetic for free. That flat line is the memory roof. Each GPU leaves it near its own $d^*$: the A100 first (its FP32 peak is low next to its HBM bandwidth), then the H100, and the 5090 only at the top of the slider.

"issue" means the scheduler's instruction rate. One FMA is one instruction, so issue-bound and compute-bound are the same wall here; the few load, store and index instructions on top tip it over.

Now the size, at degree 8 on the RTX 5090:

| elements | time | bound | achieved bandwidth |
|---:|---:|---|---:|
| 1,024 | 2.7 \xB5s | launch | 3 GB/s |
| 16,384 | 2.8 \xB5s | launch | 47 GB/s |
| 262,144 | 3.8 \xB5s | dram | 557 GB/s |
| 1,048,576 | 7.3 \xB5s | dram | 1142 GB/s |
| 16,777,216 | 77.6 \xB5s | dram | 1729 GB/s |

Below a few hundred thousand elements the kernel is **overhead-bound**. The GPU finishes the work in nanoseconds and the 2.5 \xB5s launch is the whole bill. Achieved bandwidth only approaches the peak once the transfer is long enough to amortize it.

## The system: where these numbers come from

- **Compile.** \`N.add(N.mul(y, x), c)\` \u2192 the \`nn\` dialect \u2192 decomposition into \`tensor.ew\` ops \u2192 \`contract_fma\` \u2192 lifted into one \`loop.kernel\` by fusion. See the [loop IR](lab:ir?name=loop): one load of \`x\`, $d$ FMAs, one store.
- **Schedule.** The tile pass forks over thread-per-element schedules (\`TPB\`, \`COARSEN\`). The cost model ranks them; see [Knobs](lab:view?name=knobs).
- **Measure.** The simulated GPU executes sampled blocks of the generated kernel lockstep, warp by warp. It counts flops, warp instructions and DRAM sectors, then converts the counts to time with the roofline-plus-occupancy model above. The roofline in [Perf](lab:view?name=perf) plots the point.

> **Caveat** \u2014 The simulator turns counts into time with a model, so these are not hardware numbers. Real GPUs add caches, clocks that boost and throttle, and launch overheads that vary. The shape \u2014 flat, then rising; a floor at small sizes \u2014 is what transfers. Try [WebGPU](lab:device?id=webgpu&measure) on your own GPU.

## Takeaways

1. Compute the intensity before optimizing. If $I \\ll I^*$, cutting flops does nothing; only cutting bytes helps.
2. Elementwise ops have $I < 1$: they are always memory-bound, which is why **fusion** (next: W-19) is the main optimization for them.
3. Small kernels are overhead-bound: batch them, fuse them, or capture them in a CUDA graph.

## Exercises

1. Make the polynomial read a second input (a per-element coefficient tensor). What happens to $Q$, $I$ and $d^*$?
2. Switch to the [A100](lab:device?id=sim:a100&measure) and find the smallest degree at which the bound changes. Compare with $d^* = 38$.
3. Pin \`COARSEN=4\` in Knobs at 16M elements: does processing 4 elements per thread change anything for a memory-bound kernel? Why not?

## Further reading

- Williams, Waterman, Patterson, *Roofline: An Insightful Visual Performance Model* (CACM 2009)
- Horace He, [Making Deep Learning Go Brrrr From First Principles](https://horace.io/brrr_intro.html): compute, memory, overhead
- [Modal GPU Glossary](https://modal.com/gpu-glossary): arithmetic intensity, memory-bound, ridge point

const hidden = param.int("hidden", { min: 256, max: 8192, default: 1024, scale: "log" });

for (const g of merge.guards) maybeMerge.guard(g);
const fusion = k.pass("loop/fusion").short("f").order("reverse").rules(maybeMerge).describe("fuse loop kernels, unless FUSE is off");

  }, ({ param }) => { const t = k.tensor([param(tokens), param(hidden)]); return { x: t, r: t }; })

    return { ok: run.params.get(FUSE) ? ks === 1 : ks > 1, message: \`\${ks} kernel\${ks === 1 ? "" : "s"} with fusion \${run.params.get(FUSE) ? "on" : "off"}\` };

`,notes:`# Fusion: why the compiler fuses

The elementwise tail of a transformer block \u2014 add a bias, apply GELU, scale, add the residual \u2014 does almost no arithmetic. Its cost is entirely **bytes**. Fusion turns eleven passes over memory into one. This project has a \`fuse\` switch so you can measure the difference.

> **Try it** \u2014 [measure fused](lab:measure), then [turn fusion off](lab:param?name=fuse&value=false&measure) and compare in [Perf](lab:view?name=perf). [Turn it back on](lab:param?name=fuse&value=true) when you're done.

## The program

$$y = r + s \\cdot \\operatorname{GELU}(x + b), \\qquad \\operatorname{GELU}(u) = \\tfrac12\\,u\\,\\Big(1 + \\tanh\\!\\big(\\sqrt{2/\\pi}\\,(u + 0.044715\\,u^3)\\big)\\Big)$$

$x$ and $r$ are \`tokens \xD7 hidden\` (4096 \xD7 1024 by default); $b$ is a \`hidden\` vector broadcast over the rows; $s = 0.5$.

The \`frontend/decomposition\` pass rewrites \`GELU\` into its primitive operations. Together with the bias add, the scale and the residual add, that is about a dozen elementwise operations; see the [tensor IR](lab:ir?name=tensor).

## The maths: counting bytes

Let $n$ = tokens \xD7 hidden = 4,194,304 elements, 4 bytes each, so one tensor is $4n$ bytes = 16 MiB.

**Unfused**, every operation is its own kernel. Each one reads its inputs from DRAM and writes its result back:

$$Q_\\text{unfused} = \\sum_{k \\in \\text{kernels}} 4n\\,\\big(\\text{inputs}_k + 1\\big)$$

**Fused**, there is one kernel. It reads $x$ and $r$, reads $b$ once per row (4 KiB, which stays in cache), and writes $y$:

$$Q_\\text{fused} \\approx 3 \\cdot 4n = 12n \\text{ bytes} = 48\\text{ MiB}$$

Every intermediate lives in a register for a few cycles and never touches memory.

Both versions do the same arithmetic, about 19 flop per element, so the intensity is $19/12 \\approx 1.6$ flop/byte fused and roughly ten times lower unfused. That is far below the ridge point of any GPU (W-18), so

$$t \\approx \\frac{Q}{\\beta} + K \\cdot t_\\text{launch}$$

where $K$ is the number of kernels.

## What you should see

Simulated, RTX 5090 ($\\beta$ = 1792 GB/s, $t_\\text{launch}$ = 2.5 \xB5s):

| | kernels | DRAM traffic | predicted $Q/\\beta + K t_\\text{launch}$ | simulated |
|---|---:|---:|---:|---:|
| fused | 1 | 48 MiB | 28.1 + 2.5 = 30.6 \xB5s | 30.9 \xB5s |
| unfused | 11 | 416 MiB | 243 + 27.5 = 271 \xB5s | 273.8 \xB5s |

That is a **8.9\xD7 speedup from moving fewer bytes**, with the same arithmetic. The unfused version even pays 16 MiB to materialize the bias broadcast: \`k_ew\` writes a full \`tokens \xD7 hidden\` copy of $b$, because without fusion a broadcast view becomes a real tensor.

Look at the unfused [loop IR](lab:ir?name=loop): eleven \`loop.kernel\` nodes, each a one-line loop nest. Fused, there is one kernel whose body is the whole expression; the [Graph](lab:graph?name=loop) shows the difference at a glance.

## The system: how this compiler fuses

1. **Lift.** \`loop/lowering\` turns each tensor op into a \`loop.kernel\`: an expression over output coordinates, with loads from its inputs.
2. **Fuse.** \`loop/fusion\` repeatedly inlines a producer kernel's expression into its consumer, so the consumer recomputes the producer's value where it used to load it. The pass scans **consumers first** (\`order("reverse")\`).
3. **Guard.** Inlining duplicates the producer's work at every use. A guard compares the work before and after, where a memory access costs 12 work units, and declines when the work would blow up. That is why the matmuls in W-09 stay separate.
4. **Switch.** This project wraps the standard rule: \`maybeMerge\` uses the same pattern and the same guards, but calls \`skip("fusion is switched off")\` when \`fuse\` is false. Turn on *Declined* in [Trace](lab:view?name=trace) to see it decline 10 times.

Reductions fuse too. A reduction's consumers are inlined, and loop-invariant code motion places each value at the deepest loop it depends on. That is how RMSNorm (W-05) and softmax (W-06) become one kernel each.

## When fusion is the wrong call

- **Recomputation.** Inlining a matmul into another matmul recomputes it per output element. The guard declines it (W-09).
- **Register pressure.** A fused kernel holds more live values per thread. Past the register budget, occupancy drops (W-23) or values spill to local memory.
- **Different parallel shapes.** A row reduction feeding an elementwise op over a different axis may need different thread mappings; forcing them into one kernel can serialize work.

## Takeaways

1. For memory-bound ops, **time \u2248 bytes / bandwidth**. Count the bytes and you can predict the speedup before running anything.
2. Fusion is the single biggest optimization for the "glue" of neural networks: norms, activations, residuals, dropout, bias. This is the core of what \`torch.compile\`, XLA and TVM do.
3. Launch overhead adds up: 11 kernels cost 27.5 \xB5s before moving a byte.

## Exercises

1. Predict, then measure: what does the unfused version cost at \`hidden = 256\`? Which term dominates now?
2. Add dropout-style masking, \`N.mul(y, N.gt(x, 0))\`, to the program. How many extra bytes does it cost fused? Unfused?
3. Write a rule that fuses only elementwise producers, never reductions. Is anything in this program affected?

## Further reading

- Horace He, [Making Deep Learning Go Brrrr](https://horace.io/brrr_intro.html), the section on operator fusion
- [MLC course](https://mlc.ai/summer22/), the lectures on graph-level optimization
- TVM, [*An Automated End-to-End Optimizing Compiler for Deep Learning*](https://arxiv.org/abs/1802.04799), section 3 on operator fusion

`,notes:`# Batch size and arithmetic intensity

Why is generating text one token at a time so slow, while processing a long prompt is fast? Why does serving many users at once barely cost more than serving one? All three answers come from one formula: the **arithmetic intensity of a matrix\u2013vector versus a matrix\u2013matrix product**.

> **Try it** \u2014 [measure at batch 1](lab:measure), then [batch 8](lab:param?name=batch&value=8&measure), [batch 128](lab:param?name=batch&value=128&measure) and [batch 1024](lab:param?name=batch&value=1024&measure). Watch time per token and the bound in [Perf](lab:view?name=perf). [Back to batch 1](lab:param?name=batch&value=1).

## The program

One linear layer, $y = x W^\\top$, with $W \\in \\mathbb{R}^{d \\times d}$ (here $d = 2048$, so $W$ is 16 MiB of fp32) and $x \\in \\mathbb{R}^{M \\times d}$. $M$ is the number of tokens processed together:

- **Decoding:** $M$ = the number of sequences in flight. Each step makes one token per sequence, so $M$ is 1 for a single user.
- **Prefill:** $M$ = the prompt length. All prompt tokens go through the layer at once.

## The maths

$$W_\\text{flop} = 2Md^2, \\qquad Q = 4\\,(Md + d^2 + Md) = 4d\\,(2M + d)\\ \\text{bytes}$$

The $d^2$ term is the weights. It is paid once per call, whatever $M$ is. So the intensity is

$$I(M) \\;=\\; \\frac{2Md^2}{4d(2M+d)} \\;=\\; \\frac{Md}{2(2M + d)} \\;\\approx\\; \\frac{M}{2} \\quad (M \\ll d)$$

**Each token you add to the batch adds about half a flop per byte.** At $M = 1$ the layer does 0.5 flop/byte, about 1/100 of an RTX 5090's ridge point (58.5). The weights stream from DRAM and the cores idle.

The layer becomes compute-bound when $I(M) = I^*$:

$$M^* = \\frac{2 d I^*}{d - 4I^*}$$

which gives $M^* \\approx 132$ on the RTX 5090 and $\\approx 42$ on the H100 (ridge 20).

Below $M^*$, the roofline bound $t \\ge t_\\text{launch} + Q/\\beta$ hardly changes with $M$, because $Q$ is dominated by $d^2$. **Up to $M^*$, extra tokens are nearly free.** That is the economics behind batched LLM serving, and behind speculative decoding, which turns several sequential decoding steps into one batched verification.

## What you should see

Simulated RTX 5090, $d = 2048$. The bound column is $2.5\\,\\mu s + \\max(Q/\\beta, W/\\pi)$.

| batch $M$ | intensity | roofline bound | simulated | per token | bound by |
|---:|---:|---:|---:|---:|---|
| 1 | 0.5 | 11.9 \xB5s | 12.6 \xB5s | 12.6 \xB5s | dram |
| 8 | 3.9 | 11.9 \xB5s | 33.9 \xB5s | 4.2 \xB5s | smem |
| 32 | 15.5 | 12.2 \xB5s | 42.2 \xB5s | 1.3 \xB5s | smem |
| 128 | 56.9 | 13.0 \xB5s | 86.3 \xB5s | 0.67 \xB5s | smem |
| 256 | 102 | 23.0 \xB5s | 121.5 \xB5s | 0.47 \xB5s | smem |
| 1024 | 256 | 84.5 \xB5s | 359.4 \xB5s | 0.35 \xB5s | smem |

Per-token cost falls by 36\xD7 from $M = 1$ to $M = 1024$. Two things in this table are worth a closer look.

**Batch 1 hits the roofline.** The compiler picks a row schedule: a block per output row computes a dot product with a tree reduction. That streams $W$ at 1331 GB/s, 74% of peak. A matrix\u2013vector product can't do better than streaming the weights once, so this is essentially optimal.

**Batch 8 is 2.8\xD7 off the roofline.** In theory it should cost the same as batch 1 (same bytes), but this compiler has no good schedule for "skinny" matrices:

- The row schedule re-reads $W$ once per row of $x$, so traffic grows by 8\xD7.
- The tiled schedule pads $M$ up to a 16-row tile, wasting half its work, and becomes limited by shared memory.

Production libraries ship special kernels for this shape: batched GEMV, and **split-K**, which splits the long $d$ dimension across blocks and adds the partial sums. Writing a split-K pass is a good exercise.

At large $M$ the layer is compute-heavy but shows "smem", not "compute": these FP32 SIMT kernels are limited by shared-memory bandwidth at about 24 TFLOP/s, 23% of peak. W-21 climbs that ladder. Real prefill uses tensor cores, which this compiler does not emit.

## The system

- The fork at the tile pass offers \`MAP=row\` (dot products with a block-wide tree reduction) and \`MAP=tiled\` with every legal tile shape. Open [Knobs](lab:view?name=knobs) at batch 1 and at batch 1024: the cost model's favourite flips from row to tiled as the intensity grows.
- The check in [Code](lab:view?name=code) prints the intensity of the current shape.
- The cost model's estimates, and the simulator, count bank conflicts in shared memory the same way the hardware does: per warp, the most distinct addresses that fall in one bank.

> **Caveat** \u2014 Real decode kernels also read the KV cache (attention), quantize weights to 8 or 4 bits (which cuts $Q$ by 4\u20138\xD7, so intensity goes up by the same factor), and fuse several layers. The intensity argument stays the same, with different constants.

## Takeaways

1. Matrix\u2013vector products (decoding) are memory-bound by construction: about 0.5 flop/byte in fp32.
2. Batching raises intensity linearly until the ridge point. Below it, extra batch is nearly free; above it, cost grows with the flops.
3. "Memory-bound" tells you the target. At batch 1, the job is moving the weights at full bandwidth, or moving fewer of them (quantization).

## Exercises

1. Derive $I(M)$ for fp16 weights with fp32 activations. What is $M^*$ on the RTX 5090 now?
2. Switch to the [H100](lab:device?id=sim:h100&measure). At what batch does its bound column leave DRAM?
3. Write the split-K rewrite as a Tensor IR pass: reshape the $d$ axis into $(S, d/S)$, reduce the inner axis, then the outer. Offer $S$ as a fork. Measure batch 8.

## Further reading

- [Modal GPU Glossary](https://modal.com/gpu-glossary): arithmetic intensity
- Horace He, [Making Deep Learning Go Brrrr](https://horace.io/brrr_intro.html)
- [CUTLASS documentation](https://docs.nvidia.com/cutlass/): split-K and stream-K GEMM

 *  about  one 1024\xD71024 matmul, five schedules: naive, shared-memory tiles, 1-D and 2-D register tiles, and the cost model's pick. Each step fixes the previous step's bottleneck
 *  try    Walk me through the ladder: at each step, what is the bottleneck and which metric shows it? | Why is the 8\xD78 register tile slower than 8\xD72 here?
